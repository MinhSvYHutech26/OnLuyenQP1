.home-tile.tile-coming{--g:linear-gradient(135deg,#d97706,#ea580c);--c:217,119,6;background:var(--g)}
.home-tile.tile-library{--g:linear-gradient(135deg,#0284c7,#2563eb);--c:2,132,199;background:var(--g)}
.home-tile h3{color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.home-tile p{color:rgba(255,255,255,.92);font-weight:500;opacity:1}
.home-tile .tile-number{display:none}
.home-tile .subject-icon{background:rgba(255,255,255,.95);border-radius:16px;box-shadow:0 8px 16px -6px rgba(0,0,0,.3)}
.home-tile .subject-badge{top:clamp(12px,2vh,18px);background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);color:#fff;font-size:11px;font-weight:700;padding:4px 10px}
.home-tile .tile-decoration{color:rgba(255,255,255,.28)}
.bottom-nav-group{background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:24px;padding:6px}
.bottom-nav-item{border:0;border-radius:18px;color:var(--mu)}
.bottom-nav-item:hover{transform:none;background:var(--surface-2)}
.bottom-nav-item.selected,.bottom-nav-item.selected:hover{background:var(--ac-soft);color:var(--ac-tx);box-shadow:none}
.about-button{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:var(--sh);color:var(--ac-tx);border-radius:22px;font-size:clamp(24px,4.5vh,32px);font-weight:800}
.about-button:hover{transform:translateY(-2px)}
.home-modal{background:rgba(10,13,26,.5);backdrop-filter:blur(8px)}
.home-modal-card{background:var(--surface);border:1px solid var(--bd);border-radius:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.modal-close{background:var(--surface-2);color:var(--mu);font-weight:700}
.modal-kicker{color:var(--ac-tx);letter-spacing:.04em;font-weight:700}
.home-modal-card h2{color:var(--tx);font-weight:800}.home-modal-card p{color:var(--mu);font-weight:500}
.modal-action,.button{background:var(--grad);color:#fff;border:0;border-radius:14px;box-shadow:0 12px 24px -10px rgba(99,102,241,.75),inset 0 1px 0 rgba(255,255,255,.25);font-weight:700;letter-spacing:0;padding:14px 26px;text-transform:none;transition:transform .2s,filter .2s}
.button:hover,.modal-action:hover{filter:brightness(1.07);transform:translateY(-1px)}
.button:active,.modal-action:active{transform:scale(.98)}
.button:disabled{background:var(--surface-2);color:var(--mu);box-shadow:none}
.button.secondary,.back-button{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);box-shadow:var(--sh);font-weight:700}
.back-button{border-radius:14px}.back-button:hover{background:var(--surface-2);border-color:var(--bd-2)}
.top-pill{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--bd);box-shadow:none;color:var(--mu);font-weight:600}
.select-wrap select{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);border-radius:14px;box-shadow:none;font-weight:600}
.select-wrap select:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--ring)}
.mode-button{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);border-radius:18px;box-shadow:none;animation:none}
.mode-button:hover{transform:translateY(-1px);background:var(--surface-2)}
.mode-button.active{background:var(--ac-soft);border-color:var(--ac);box-shadow:0 0 0 3px var(--ring)}
.mode-button.active .mode-title{color:var(--ac-tx)}
.mode-icon,.mode-button.exam .mode-icon{background:var(--surface-2);border:0}
.mode-title{font-weight:700}.mode-sub{color:var(--mu);font-weight:500}
body.is-studying #quiz{background:transparent;border:0;box-shadow:none}
body.is-studying .sticky-dashboard{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh)}
.progress{height:10px;background:var(--surface-2);border-radius:99px;overflow:visible}
.progress span{background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899);border-radius:99px;box-shadow:0 0 14px rgba(139,92,246,.55);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-copy{color:var(--mu);font-weight:600}.progress-copy strong{color:var(--tx)}
.score{background:var(--ac-soft);color:var(--ac-tx);border:1px solid var(--ac-bd);font-weight:700}
body.is-studying .question-card.current-question-card,body.is-studying .question-card.current-question-card.answered{background:var(--surface);border:1px solid var(--bd);border-radius:28px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 30px 60px -24px rgba(15,23,42,.28)}
body.is-studying .question-card-preview{background:var(--surface);border:1px solid var(--bd);border-radius:28px;box-shadow:var(--sh)}
.question-card .question-meta{display:inline-flex;padding:4px 10px;border-radius:99px;background:var(--ac-soft);color:var(--ac-tx);font-size:11px;font-weight:700;letter-spacing:.04em}
.question-text{color:var(--tx);font-weight:700}
body.is-studying .question-card.current-question-card .option{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);border-radius:16px;box-shadow:none;font-weight:500;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}
body.is-studying .question-card.current-question-card .option:hover:not(:disabled):not([aria-disabled=true]):not(.selected):not(.correct):not(.incorrect){border-color:var(--ac-bd);background:var(--ac-soft);transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(99,102,241,.5)}
body.is-studying .question-card.current-question-card .option.selected{background:var(--ac-soft);border-color:var(--ac);box-shadow:0 0 0 3px var(--ring);color:var(--ac-tx);outline:0}
body.is-studying .question-card.current-question-card .option.correct{background:var(--ok-bg);border-color:var(--ok-bd);box-shadow:0 0 0 3px rgba(16,185,129,.18);color:var(--ok-tx);animation:mmPop .35s}
body.is-studying .question-card.current-question-card .option.incorrect{background:var(--bad-bg);border-color:var(--bad-bd);box-shadow:0 0 0 3px rgba(244,63,94,.16);color:var(--bad-tx)}
body.is-studying .question-card.current-question-card .choice-letter{width:32px;height:32px;margin-top:0;background:var(--surface-2);border:0;border-radius:10px;color:var(--mu);font-size:13px;font-weight:700}
body.is-studying .question-card .option.selected .choice-letter{background:var(--ac);color:#fff}
body.is-studying .question-card .option.correct .choice-letter{background:#10b981;color:#fff}
body.is-studying .question-card .option.incorrect .choice-letter{background:#f43f5e;color:#fff}
.question-card .feedback{border-radius:16px;font-weight:600}
.feedback.good{background:var(--ok-bg);color:var(--ok-tx)}.feedback.bad{background:var(--bad-bg);color:var(--bad-tx)}
.result-strip{background:var(--surface);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:20px}
.result-strip strong,.finish-score{color:var(--ac-tx)}.finish-icon{background:var(--ac-soft);color:var(--ac-tx)}
@keyframes mmPop{40%{transform:scale(1.02)}}
@media(max-width:420px){.mm-chip{padding:7px 10px;font-size:13px}.mm-goal{padding-bottom:12px}.home-header{padding:12px 14px;border-radius:24px}}

/* Three subject cards inspired by the supplied reference. */
.home-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(190px,1fr));gap:clamp(15px,3vh,30px);max-height:520px;flex:1 1 auto}
.home-tile{min-height:190px;padding:24px 18px;border:5px solid transparent;border-radius:30px;background-clip:padding-box,border-box;box-shadow:0 9px 0 rgba(54,74,46,.13),0 18px 32px rgba(44,58,34,.12)}
.home-tile.tile-philosophy{--tile-ink:#fff;background-image:linear-gradient(115deg,#09d6b4 0%,#079be6 100%),linear-gradient(130deg,#fd3041,#ffad19);}
.home-tile.tile-practice{--tile-ink:#fff;background-image:linear-gradient(115deg,#ff6b00 0%,#ffc400 100%),linear-gradient(130deg,#53df18,#087a25);}
.home-tile.tile-english{--tile-ink:#fff;background-image:linear-gradient(115deg,#00c890 0%,#39e532 100%),linear-gradient(130deg,#16276e,#16ddd0);}
.home-tile .tile-number{display:none}.home-tile .subject-badge{z-index:2;top:17px;right:17px;padding:5px 10px;background:rgba(255,255,255,.8);color:#315638}
.home-tile .subject-icon{position:absolute;z-index:2;top:14px;left:auto;right:18px;width:clamp(42px,6vh,56px);height:clamp(42px,6vh,56px);background:rgba(255,255,255,.20);box-shadow:none}
.home-tile h3,.home-tile p{position:relative;z-index:1;width:56%;margin-left:auto;text-align:center;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.22)}
.home-tile h3{margin-top:clamp(36px,6vh,58px);margin-bottom:5px;font-size:clamp(20px,2.5vw,31px);font-weight:900;line-height:1.05;letter-spacing:-.03em}
.home-tile p{max-width:58%;margin-top:2px;font-size:clamp(11px,1.35vw,14px);font-weight:750;opacity:1}
.home-tile .tile-mascot{z-index:1;left:2%;right:auto;bottom:-11%;width:49%;height:108%;object-fit:contain;border-radius:0;filter:drop-shadow(0 9px 9px rgba(16,52,19,.22));transition:transform .35s}
.home-tile:hover .tile-mascot{transform:translateY(-7px) rotate(4deg)}.home-tile .tile-decoration{z-index:0;right:13px;bottom:8px;color:rgba(255,255,255,.25)}
.tile-philosophy .subject-icon svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}.tile-practice .subject-icon svg,.tile-english .subject-icon svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.listening-tools{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:0 0 14px}.listen-play{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:77px;border:1px solid #add8ef;border-radius:13px;padding:8px 11px;background:#eef9ff;color:#205c7d;font:inherit;font-weight:800;cursor:pointer}.listen-play svg{width:20px;height:20px;flex:none}.listen-play:disabled{opacity:.65;cursor:default}.listen-transcript{font-size:13px;color:var(--muted)}.listen-transcript summary{cursor:pointer;font-weight:750}.listen-transcript p{white-space:pre-wrap;margin:7px 0 0;color:#344336;line-height:1.45}
.reading-passage{max-height:clamp(150px,27vh,260px);overflow:auto;margin:0 0 12px;padding:12px 14px;border:1px solid #d9e8d3;border-radius:15px;background:#f6fbf2;color:#314337;font-size:clamp(13px,1.8vh,15px);line-height:1.55;white-space:pre-wrap}
@media(max-width:560px){.home-grid{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(145px,1fr));gap:12px;max-height:none}.home-tile{min-height:145px;padding:16px 14px;border-width:4px;border-radius:25px}.home-tile .tile-mascot{width:40%;height:110%;bottom:-13%}.home-tile .subject-icon{top:11px;right:12px}.home-tile .subject-badge{top:13px;right:14px}.home-tile h3{width:58%;margin-top:43px;font-size:clamp(21px,6vw,27px)}.home-tile p{width:58%;max-width:58%;font-size:11px}.home-tile .tile-decoration{font-size:48px}}
@media(max-height:680px) and (min-width:561px){.home-grid{grid-template-rows:repeat(2,minmax(155px,1fr));max-height:410px;gap:12px}.home-tile{min-height:155px;padding:14px}.home-tile .tile-mascot{width:45%;height:105%}.home-tile h3{margin-top:36px;font-size:clamp(19px,2.3vw,26px)}}

.question-audio-row{display:flex;align-items:flex-start;gap:10px}.question-audio-row .question-text{flex:1;min-width:0;margin-bottom:15px}.question-audio-row .listen-play{flex:none;width:46px;height:46px;min-width:46px;padding:9px;border-radius:50%;margin-top:1px}.question-audio-row .listen-play span{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.listening-tools{margin:-5px 0 13px}

const mascotImages = {happy:slimoMascot,encouraging:slimoMascot,studying:slimoMascot,thinking:slimoMascot,sad:slimoMascot,angry:slimoMascot,tired:slimoMascot,cheering:slimoMascot};
function setMascotExpression(expression='happy') {
  const name=mascotImages[expression]?expression:'happy';
  lastMascotExpression=name;
  [homeMascot,studyMascot,modalMascot,...document.querySelectorAll('.tile-mascot')].forEach(image=>{
    if(!image)return;
    image.src=mascotImages[name];
    image.classList.remove('mascot-react');
    void image.offsetWidth;
    image.classList.add('mascot-react');
  });
}
function openQuizSetup(nextMode) {
  setMode(nextMode);
  homeModal.classList.remove('about-open');
  homeQuizSetup.hidden=false;
  document.getElementById('homeModalText').hidden=true;
  document.getElementById('homeModalAction').hidden=true;
  document.getElementById('homeModalKicker').textContent=nextMode==='exam'?'THI THỬ':'ÔN TẬP';
  document.getElementById('homeModalTitle').textContent=nextMode==='exam'?`Thi thử ${subjectLabel()}`:`Chọn cách ôn ${subjectLabel()}`;
  setMascotExpression(nextMode==='exam'?'encouraging':'studying');
  homeModal.hidden=false;
  document.getElementById(selectedSubject === 'qp' ? 'bank' : 'scope').focus();
}
function openHomePanel(kind) {
  const title=document.getElementById('homeModalTitle'), kicker=document.getElementById('homeModalKicker'), copy=document.getElementById('homeModalText'), action=document.getElementById('homeModalAction');
  const total=questionQueue.length, done=selectedAnswers.size;
  const panels={
    tips:['MẸO HỌC','Ôn theo chặng ngắn','Chia nhỏ bài ôn, rồi nghỉ một chút để đầu óc nhẹ nhàng hơn.','tired'],
    philosophy:['SẮP CÓ','Triết học','Môn Triết học đang được chuẩn bị. Khi có tài liệu ôn tập, bạn sẽ chọn môn này ngay tại đây.','angry'],
    moreSubjects:['THƯ VIỆN MÔN HỌC','Sắp có thêm môn','Các môn học mới sẽ được thêm vào thư viện khi có nội dung ôn tập.','thinking'],
    progress:['HÀNH TRÌNH CỦA BẠN',total?`Đã làm ${done}/${total} câu`: 'Chặng đầu tiên đang chờ bạn','Bắt đầu một lượt ôn tập để theo dõi số câu đã làm và điểm hiện tại ngay tại đây. Tiến độ được giữ khi bạn chuyển qua lại giữa các màn hình.',total&&done===total?'cheering':'thinking'],
    profile:['HỒ SƠ HỌC TẬP','Học viên của Góc ôn tập','Không cần tài khoản. Chọn môn học và bắt đầu theo tốc độ của riêng bạn.','happy'],
    about:['Người tạo web','Quốc Minh','Sinh viên Y khoa HUTECH · Chúc bạn ôn vui, thi tốt!','happy']
  };
  const [label,heading,description,pose]=panels[kind]||panels.about;
  homeQuizSetup.hidden=true; document.getElementById('homeModalText').hidden=false; action.hidden=false;
  kicker.textContent=label; title.textContent=heading; copy.textContent=description; action.textContent=kind==='progress'&&!total?'Bắt đầu ôn tập':'Đã hiểu';
  action.dataset.modalAction=kind==='progress'&&!total?'practice':'close';
  homeModal.classList.toggle('about-open',kind==='about');
  setMascotExpression(pose); homeModal.hidden=false;
  document.getElementById('closeHomeModal').focus();
}
function closeHomePanel() { homeModal.hidden=true; homeModal.classList.remove('about-open'); homeQuizSetup.hidden=true; document.getElementById('homeModalText').hidden=false; document.getElementById('homeModalAction').hidden=false; }
function searchKey(value) { return value.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
function filterHomeTiles() {
  const term=searchKey(homeSearch.value.trim()); let shown=0;
  document.querySelectorAll('.home-tile').forEach(tile=>{const haystack=searchKey(tile.dataset.search+' '+tile.textContent);const match=!term||haystack.includes(term)||(/^bai(?:\s+\d+)?$/.test(term)&&tile.dataset.homeAction==='qp');tile.hidden=!match;if(match)shown++;});
  document.getElementById('homeNoResults').hidden=shown>0;
  clearSearchButton.hidden=!term;
  if(term&&shown===0)setMascotExpression('sad');
}
function handleHomeAction(action) {
  if(action==='qp'||action==='english'||action==='practice'||action==='exam') {
    if(action==='english'&&!ENGLISH_LESSONS.length){alert('Chưa tải được english-bank.js. Hãy đặt file này cùng thư mục với index.html.');return;}
    setActiveSubject(action==='english'?'english':'qp');openQuizSetup(action==='exam'?'exam':'practice');return;
  }
  openHomePanel(action);
}
function populateLessons() {
  scopeSelect.replaceChildren();
  const all = document.createElement('option'); all.value = 'all'; all.textContent = 'Ôn toàn bộ câu hỏi'; scopeSelect.append(all);
  for (const lesson of LESSONS) {
    const option = document.createElement('option'); option.value = `lesson-${lesson.id}`; option.textContent = lesson.title; scopeSelect.append(option);
  }
}
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function selectedQuestions() {
  if (scopeSelect.value === 'all') return LESSONS.flatMap(lesson => lesson.questions);
  const id = Number(scopeSelect.value.replace('lesson-', ''));
  return LESSONS.find(lesson => lesson.id === id)?.questions || [];
}
function setMode(next) {
  mode = next;
  practiceMode.classList.toggle('active', mode === 'practice');
  examMode.classList.toggle('active', mode === 'exam');
  practiceMode.setAttribute('aria-pressed',String(mode==='practice'));
  examMode.setAttribute('aria-pressed',String(mode==='exam'));
  scopeWrap.classList.toggle('hidden', mode === 'exam');
  refreshBeginButton();
}
function getSessionConfig() {
  return {subject:selectedSubject,bank:bankSelect.value,scope:scopeSelect.value,mode};
}
function isSameSession(a,b) {
  return !!a&&!!b&&a.subject===b.subject&&a.bank===b.bank&&a.scope===b.scope&&a.mode===b.mode;
}
function refreshBeginButton() {
  const continuing=questionQueue.length>0&&isSameSession(sessionConfig,getSessionConfig());
  beginQuizButton.querySelector('span:first-child').textContent=continuing?'Tiếp tục ôn tập':'Bắt đầu ôn tập';
}
function switchScreen(target,forward) {
  if(!target||target===activeScreen)return;
  const currentScreen=activeScreen;
  const token=++screenTransitionToken;
  window.scrollTo({top:0,behavior:'auto'});
  document.body.classList.toggle('is-studying',target===studyScreen);
  target.hidden=false;
  currentScreen.classList.remove('enter-forward','enter-back','leave-forward','leave-back');
  target.classList.remove('enter-forward','enter-back','leave-forward','leave-back');
  target.classList.add(forward?'enter-forward':'enter-back');
  currentScreen.classList.add(forward?'leave-forward':'leave-back');
  setTimeout(()=>{
    if(token!==screenTransitionToken)return;
    currentScreen.hidden=true;
    currentScreen.classList.remove('enter-forward','enter-back','leave-forward','leave-back');
    target.classList.remove('enter-forward','enter-back','leave-forward','leave-back');
    activeScreen=target;
    if(target===studyScreen)layoutCoverflowStage();
    window.scrollTo({top:0,behavior:'auto'});
  },500);
  requestAnimationFrame(()=>{if(target===studyScreen)layoutCoverflowStage();});
}
function beginOrContinue() {
  const chosenConfig=getSessionConfig();
  if(!questionQueue.length||!isSameSession(sessionConfig,chosenConfig)) {
    startQuiz();
    sessionConfig=chosenConfig;

const draw=()=>{roll();$('mmStreak').querySelector('b').textContent=S.streak;const g=$('mmGoal');g.querySelector('b').textContent=S.n;g.style.setProperty('--p',Math.min(100,S.n/G*100)+'%');g.classList.toggle('done',S.n>=G)};
const hash=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
const rec=()=>{const c=document.querySelector('.question-card.current-question-card.answered'),q=c&&c.querySelector('.question-text');if(!q)return;roll();const k=hash(q.textContent);if(S.seen.includes(k))return;S.seen.push(k);S.n++;S.total++;if(S.last!==now()){S.streak=S.last===prev()?S.streak+1:1;S.last=now()}ls.set(K,JSON.stringify(S));draw();if(S.n===G)toast('Đạt mục tiêu hôm nay! 🎉')};
const qz=$('quiz');let raf=0;if(qz)new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(rec)}).observe(qz,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
draw();
const pn=document.querySelector('[data-home-nav=progress]');
if(pn)pn.addEventListener('click',()=>{roll();const s=(i,v)=>{const e=$(i);if(e)e.textContent=v};s('homeModalKicker','Tiến độ của bạn');s('homeModalTitle',S.streak+' ngày học liên tiếp');s('homeModalText','Hôm nay bạn đã làm '+S.n+'/'+G+' câu. Tổng cộng '+S.total+' câu. Học đều mỗi ngày để giữ chuỗi nhé!')});
})();
</script>
<!-- THƯ VIỆN ĐỌC FILE .DOCX TRỰC TIẾP TRÊN TRÌNH DUYỆT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- MODULE TỰ ĐỘNG NHẬN DIỆN ĐỀ TRIẾT & BỐC 50 CÂU PHÂN BỔ ĐỀU 3 BÀI -->
<script>
(function() {
  const DOCX_FILENAME = "Ngan_hang_trac_nghiem_Triet_hoc_451_cau.docx";
  let philPool = { 1: [], 2: [], 3: [] };
  let isPhilLoaded = false;
  let isPhilLoading = false;

  // 1. Chuyển giao diện thẻ Triết học sang trạng thái "Sẵn sàng"
  const philTile = document.querySelector('[data-home-action="philosophy"]');
  if (philTile) {
    const badge = philTile.querySelector('.subject-badge');
    if (badge) {
      badge.textContent = "Sẵn sàng";
      badge.classList.remove('badge-soon');
      badge.classList.add('badge-ready');
    }
    const desc = philTile.querySelector('p');
    if (desc) desc.textContent = "Thi thử 50 câu · Phân bổ đều 3 bài";
  }

  // 2. Hàm phân loại câu hỏi về đúng 3 Chương/Bài dựa trên mã thẻ [tag] và từ khóa
  function detectLessonGroup(tag, questionText) {
    const t = (tag || "").toUpperCase();
    // Chương 1: Khái luận về Triết học và Triết học Mác - Lênin
    if (t.includes("S03") || t.includes("P1-") || t.includes("KTRA1") || t.includes("VIDEO")) return 1;
    // Chương 2: Chủ nghĩa duy vật biện chứng
    if (t.includes("S02") || t.includes("P2-") || t.includes("BO2")) return 2;
    // Chương 3: Chủ nghĩa duy vật lịch sử
    if (t.includes("S01") || t.includes("P3-")) return 3;

    // Dự phòng bằng từ khóa nếu câu không khớp tag
    const q = questionText.toLowerCase();
    if (/lực lượng sản xuất|quan hệ sản xuất|cơ sở hạ tầng|kiến trúc thượng tầng|giai cấp|nhà nước|hình thái kinh tế|quần chúng nhân dân/.test(q)) return 3;
    if (/thế giới quan|vấn đề cơ bản của triết học|bất khả tri|khả tri|cổ điển đức|phoi-ơ-bắc|hêghen/.test(q)) return 1;
    return 2;
  }

  // 3. Hàm đọc và bóc tách 451 câu hỏi từ file .docx
  async function loadPhilosophyDocx() {
    if (isPhilLoaded) return true;
    if (isPhilLoading) return false;
    isPhilLoading = true;

    try {
      const response = await fetch(DOCX_FILENAME);
      if (!response.ok) throw new Error("Không tìm thấy file " + DOCX_FILENAME + " trên GitHub!");
      const arrayBuffer = await response.arrayBuffer();
      const zip = await JSZip.loadAsync(arrayBuffer);
      const xmlText = await zip.file("word/document.xml").async("string");

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const paragraphs = xmlDoc.getElementsByTagName("w:p");

      const lines = [];
      for (let i = 0; i < paragraphs.length; i++) {
        const texts = paragraphs[i].getElementsByTagName("w:t");
        let line = "";
        for (let j = 0; j < texts.length; j++) {
          line += texts[j].textContent;
        }
        line = line.trim();
        if (line) lines.push(line);
      }

      // Bước 3.1: Đọc "Phần 2. Bảng đáp án nhanh" ở cuối file để đối chiếu chính xác 100%
      const answerKeyMap = {};
      let inAnswerTable = false;
      for (const line of lines) {
        if (line.includes("Phần 2. Bảng đáp án nhanh")) inAnswerTable = true;
        if (inAnswerTable) {
          const matches = [...line.matchAll(/(\d+)\s+([A-D])/g)];
          for (const m of matches) {
            answerKeyMap[parseInt(m[1], 10)] = m[2];
          }
        }
      }

      // Bước 3.2: Bóc tách từng câu hỏi, các phương án A B C D và dấu ✓
      philPool = { 1: [], 2: [], 3: [] };
      let currentQ = null;

      for (const line of lines) {
        if (line.includes("Phần 2. Bảng đáp án nhanh")) break;

        // Nhận diện dòng bắt đầu câu hỏi: "Câu 1. ..." hoặc "Câu 396. ★ ..."
        const qMatch = line.match(/^Câu\s+(\d+)\.\s*(?:★\s*)?(.*)$/i);
        if (qMatch) {
          if (currentQ && currentQ.options.length >= 2) {
            finalizeQuestion(currentQ, answerKeyMap);
          }
          const qNum = parseInt(qMatch[1], 10);
          let rawBody = qMatch[2].trim();
          let tag = "";

          // Tách mã nguồn ở cuối câu (VD: [DOCX·S01-Q001])
          const tagMatch = rawBody.match(/\[([^\]]+)\]\s*$/);
          if (tagMatch) {
            tag = tagMatch[1];
            rawBody = rawBody.slice(0, tagMatch.index).trim();
          }

          currentQ = {
            num: qNum,
            text: rawBody,
            tag: tag,
            options: [],
            answerIndex: -1
          };
          continue;
        }

        // Nhận diện dòng phương án A., B., C., D.
        if (currentQ) {
          const optMatch = line.match(/^([A-D])\.\s*(.*)$/);
          if (optMatch) {
            const label = optMatch[1].toUpperCase();
            let optBody = optMatch[2].trim();
            let isCorrect = false;

            // Kiểm tra dấu ✓ ở cuối phương án
            if (optBody.includes("✓")) {
              isCorrect = true;
              optBody = optBody.replace(/✓/g, "").trim();
            }

            const idx = currentQ.options.length;
            if (isCorrect) currentQ.answerIndex = idx;

            currentQ.options.push({
              label: label,
              text: label + ". " + optBody,
              correctMarked: isCorrect
            });
          } else if (currentQ.options.length === 0) {
            // Nối tiếp văn bản câu hỏi nếu bị xuống dòng
            let extra = line;
            const tagMatch = extra.match(/\[([^\]]+)\]\s*$/);
            if (tagMatch) {
              currentQ.tag = tagMatch[1];
              extra = extra.slice(0, tagMatch.index).trim();
            }
            if (extra) currentQ.text += " " + extra;
          }
        }
      }

      if (currentQ && currentQ.options.length >= 2) {
        finalizeQuestion(currentQ, answerKeyMap);
      }

      isPhilLoaded = true;
      isPhilLoading = false;
      return true;
    } catch (err) {
      console.error(err);
      isPhilLoading = false;
      alert("Không thể đọc file đề Triết học: " + err.message);
      return false;
    }
  }

  function finalizeQuestion(q, answerKeyMap) {
    // Nếu chưa bắt được dấu ✓ thì tra từ Bảng đáp án nhanh ở Phần 2
    if (q.answerIndex === -1 && answerKeyMap[q.num]) {
      const targetLabel = answerKeyMap[q.num];
      const foundIdx = q.options.findIndex(o => o.label === targetLabel);
      if (foundIdx !== -1) {
        q.answerIndex = foundIdx;
        q.options[foundIdx].correctMarked = true;
      }
    }
    if (q.answerIndex === -1) q.answerIndex = 0;

    const group = detectLessonGroup(q.tag, q.text);
    philPool[group].push({
      id: "triet-" + q.num,
      text: q.text,
      options: q.options,
      answerIndex: q.answerIndex,
      sourceKeyMarked: true,
      lessonGroup: group
    });
  }

  // 4. Thuật toán xáo trộn Fisher-Yates & Rút 50 câu chia đều 3 bài (17 - 17 - 16)
  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function drawBalanced50Questions() {
    // Xáo trộn ngẫu nhiên thứ tự phân bổ [17, 17, 16] giữa 3 bài để công bằng tuyệt đối
    const quotas = shuffleArray([17, 17, 16]);
    const g1 = shuffleArray(philPool[1]).slice(0, quotas[0]);
    const g2 = shuffleArray(philPool[2]).slice(0, quotas[1]);
    const g3 = shuffleArray(philPool[3]).slice(0, quotas[2]);

    // Trộn đều toàn bộ 50 câu đã rút để đề thi ngẫu nhiên hoàn toàn
    return shuffleArray([...g1, ...g2, ...g3]);
  }

  // 5. Tích hợp thẳng vào luồng làm bài (Study Screen) hiện tại của Web
  // Bắt sự kiện khi bấm vào thẻ môn "Triết học"
  if (philTile) {
    philTile.addEventListener("click", async function(e) {
      e.preventDefault();
      e.stopImmediatePropagation();

      const badge = philTile.querySelector('.subject-badge');
      const oldBadgeText = badge ? badge.textContent : "";
      if (badge) badge.textContent = "Đang tải đề...";

      const ok = await loadPhilosophyDocx();
      if (badge) badge.textContent = oldBadgeText;
      if (!ok) return;

      // Giữ riêng đề Triết học, không thay đổi kho đề Quốc phòng.
      const selected50 = drawBalanced50Questions();
      PHILOSOPHY_LESSONS = [{ id: 1, title: "Triết học Mác - Lênin (50 câu)", questions: selected50 }];

      // Kích hoạt chế độ lấy toàn bộ 50 câu vừa rút (dùng cơ chế sẵn có của web)
      const scopeSelect = document.getElementById("scope");
      const practiceBtn = document.getElementById("practiceMode");
      const beginBtn = document.getElementById("beginQuiz");

      setActiveSubject("philosophy");
      if (practiceBtn) practiceBtn.click();
      if (scopeSelect) {
        scopeSelect.value = "all";
        scopeSelect.dispatchEvent(new Event("change", { bubbles: true }));
      }
      if (beginBtn) beginBtn.click();
    }, true);
  }
})();
</script>
