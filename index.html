ectMarked":false}],"answerIndex":2,"id":"4-35","sourceKeyMarked":true},{"text":"Chiến tranh nhân dân bảo vệ Tổ quốc nhằm mục đích gì?","options":[{"label":"A","text":"A. Giữ vững ổn định đất nước, phát triển kinh tế- xã hội,quốc phòng an ninh theo định hướng xã hội chủ nghĩa","correctMarked":false},{"label":"B","text":"B. Giữ vững ổn định chính trị và môi trường hòa bình, phát triển đất nước theo định hướng xã hội chủ nghĩa","correctMarked":true},{"label":"C","text":"C. Giữ vững ổn định chính trị xã hội tạo điều kiện thuận lợi cho xây dựng kinh tế củng cố quốc phòng an ninh","correctMarked":false},{"label":"D","text":"D. Giữ vững ổn định chính trị xã hội cho sự nghiệp công nghiệp hóa, hiện đại hóa phát triển đất nước theo định hướng xã hội chủ nghĩa","correctMarked":false}],"answerIndex":1,"id":"4-36","sourceKeyMarked":true},{"text":"Ngày 19/12/1946 Hồ Chí Minh ra lời kêu gọi toàn quốc kháng chiến thể hiện nội dung nào trong nghệ thuật chiến lược?","options":[{"label":"A","text":"A. Đánh giá đúng kẻ thù","correctMarked":false},{"label":"B","text":"B. Phương châm tiến hành chiến tranh","correctMarked":false},{"label":"C","text":"C. Mở đầu và kết thúc chiến tranh đúng lúc","correctMarked":true},{"label":"D","text":"D. Xác định đúng đối tượng tác chiến","correctMarked":false}],"answerIndex":2,"id":"4-37","sourceKeyMarked":true},{"text":"Lực lượng vũ trang nhân dân 3 thứ quân của Việt Nam gồm?","options":[{"label":"A","text":"A. Bộ đội chủ lực, Bộ đội Biên phòng và Cảnh sát biển Việt Nam","correctMarked":false},{"label":"B","text":"B. Bộ đội thường trực, lực lượng dự bị, dân quân tự vệ","correctMarked":false},{"label":"C","text":"C. Bộ đội chủ lực, bộ đội địa phương, dân quân tự vệ","correctMarked":true},{"label":"D","text":"D. Bộ đội chủ lực, lực lượng dự bị động viên và Công an nhân dân","correctMarked":false}],"answerIndex":2,"id":"4-38","sourceKeyMarked":true}]},{"id":5,"title":"Bài 5","questions":[{"text":"Lực lượng vũ trang nhân dân là gì?","options":[{"label":"A","text":"A. Là các tổ chức vũ trang và bán vũ trang của nhân dân","correctMarked":true},{"label":"B","text":"B. Là các tổ chức vũ trang của quân đội nhân dân Việt Nam","correctMarked":false},{"label":"C","text":"C. Là các tổ chức bán vũ trang của công an nhân dân Việt Nam","correctMarked":false},{"label":"D","text":"D. Là quân đội nhân dân và công an nhân dân","correctMarked":false}],"answerIndex":0,"id":"5-1","sourceKeyMarked":true},{"text":"Lực lượng vũ trang nhân dân trong bảo vệ Tổ quốc có vị trí như thế nào ?","options":[{"label":"A","text":"A. Là lực lượng xung kích trong các hoạt động quân sự, an ninh","correctMarked":false},{"label":"B","text":"B. Là lực lượng nòng cốt của quốc phòng toàn dân và chiến tranh nhân dân","correctMarked":true},{"label":"C","text":"C. Là lực lượng chủ yếu của sự nghiệp xây dựng và bảo vệ Tổ quốc","correctMarked":false},{"label":"D","text":"D. Là lực lượng nòng cốt, quyết định của sự nghiệp xây dựng và bảo vệ Tổ quốc","correctMarked":false}],"answerIndex":1,"id":"5-2","sourceKeyMarked":true},{"text":"Có mấy đặc điểm liên quan đến xây dựng lực lượng vũ trang nhân dân?","options":[{"label":"A","text":"A. Có 3 đặc điểm","correctMarked":false},{"label":"B","text":"B. Có 4 đặc điểm","correctMarked":true},{"label":"C","text":"C. Có 5 đặc điểm","correctMarked":false},{"label":"D","text":"D. Có 6 đặc điểm","correctMarked":false}],"answerIndex":1,"id":"5-3","sourceKeyMarked":true},{"text":"Hai nhiệm vụ chiến lược của cách mạng nước ta hiện nay là gì?","options":[{"label":"A","text":"A. Phát triển kinh tế - xã hội gắn với xây dựng lực lượng vũ trang nhân dân","correctMarked":false},{"label":"B","text":"B. Phát triển kinh tế - xã hội gắn với củng cố nền quốc phòng an ninh nhân dân","correctMarked":false},{"label":"C","text":"C. Công nghiệp hóa, hiện đại hóa gắn với phát triển nông nghiệp nông thôn","correctMarked":false},{"label":"D","text":"D. Xây dựng và bảo vệ Tổ quốc Việt nam xã hôi chủ nghĩa","correctMarked":true}],"answerIndex":3,"id":"5-4","sourceKeyMarked":true},{"text":"Đặc điểm liên quan đến quá trình xây dựng lực lượng vũ trang nhân dân Việt Nam?","options":[{"label":"A","text":"A. Cả nước đang thực hiện hai nhiệm vụ chiến lược, trong khi kẻ thù chống phá ta quyết liệt","correctMarked":true},{"label":"B","text":"B. Tình hình thế giới cơ bản ổn định, không còn nguy cơ xung đột và cạnh tranh chiến lược","correctMarked":false},{"label":"C","text":"C. Lực lượng vũ trang nhân dân chỉ cần chú trọng hiện đại hóa trang bị","correctMarked":false},{"label":"D","text":"D. Sự nghiệp công nghiệp hóa, hiện đại hóa đất nước đã hoàn thành, tạo nền tảng quốc phòng vững chắc","correctMarked":false}],"answerIndex":0,"id":"5-5","sourceKeyMarked":true},{"text":"Đảng lãnh đạo lực lượng vũ trang nhân dân theo nguyên tắc gì?","options":[{"label":"A","text":"A. Tuyệt đối, trực tiếp và toàn diện","correctMarked":false},{"label":"B","text":"B. Tuyệt đối, trực tiếp về mọi mặt","correctMarked":true},{"label":"C","text":"C. Tuyệt đối, toàn diện, lãnh đạo chính trị là quyết định","correctMarked":false},{"label":"D","text":"D. Tuyệt đối, toàn diện trên mọi lĩnh vực","correctMarked":false}],"answerIndex":1,"id":"5-6","sourceKeyMarked":true},{"text":"Xây dựng lực lượng vũ trang nhân dân hiện nay có thuận lợi cơ bản:","options":[{"label":"A","text":"A. Đảng ta có bản lĩnh chính trị vững vàng","correctMarked":true},{"label":"B","text":"B. Lực lượng vũ trang nhân dân đã hoàn thành mục tiêu hiện đại hóa toàn diện","correctMarked":false},{"label":"C","text":"C. Nhà nước chỉ tập trung đầu tư cho phát triển kinh tế, không ưu tiên quốc phòng và an ninh","correctMarked":false},{"label":"D","text":"D. Kinh tế, xã hội và quốc phòng, an ninh đang suy giảm do tác động của tình hình thế giới","correctMarked":false}],"answerIndex":0,"id":"5-7","sourceKeyMarked":true},{"text":"Một trong những quan điểm của Đảng về xây dựng lực lượng vũ trang nhân dân là gì?","options":[{"label":"A","text":"A. Phát huy nội lực kết hợp với sức mạnh thời đại","correctMarked":false},{"label":"B","text":"B. Độc lập, tự chủ để phát triển lực lượng vũ trang nhân dân","correctMarked":false},{"label":"C","text":"C. Tự lực, tự cường xây dựng lực lượng vũ trang nhân dân","correctMarked":true},{"label":"D","text":"D. Phát huy truyền thống dân tộc để xây dựng lực lượng vũ trang nhân dân","correctMarked":false}],"answerIndex":2,"id":"5-8","sourceKeyMarked":true},{"text":"Cơ quan nào quản lý lực lượng vũ trang nhân dân?","options":[{"label":"A","text":"A. Quân đội, Công an nhân dân","correctMarked":false},{"label":"B","text":"B. Nhà nước Cộng hòa Xã hội chủ nghĩa Việt Nam","correctMarked":true},{"label":"C","text":"C. Đảng Cộng sản Việt Nam","correctMarked":false},{"label":"D","text":"D. Chính quyền địa phương các cấp","correctMarked":false}],"answerIndex":1,"id":"5-9","sourceKeyMarked":true},{"text":"Một trong những quan điểm trong xây dựng lực lượng vũ trang nhân dân là gì?","options":[{"label":"A","text":"A. Xây dựng lực lượng vũ trang nhân dân lấy số lượng là chủ yếu, từng bước nâng cao chất lượng","correctMarked":false},{"label":"B","text":"B. Xây dựng lực lượng vũ trang nhân dân lấy chất lượng là chính, lấy xây dựng chính trị làm cơ sở","correctMarked":true},{"label":"C","text":"C. Xây dựng lực lượng vũ trang nhân dân toàn diện cả về số lượng và chất lượng","correctMarked":false},{"label":"D","text":"D. Xây dựng lực lượng vũ trang nhân dân toàn diện, tập trung hiện đại quân đội","correctMarked":false}],"answerIndex":1,"id":"5-10","sourceKeyMarked":true},{"text":"Đảng Cộng sản Việt Nam lãnh đạo lực lượng vũ trang trên lĩnh vực nào?","options":[{"label":"A","text":"A. Trên tất cả các lĩnh vực","correctMarked":true},{"label":"B","text":"B. Trên lĩnh vực chính trị","correctMarked":false},{"label":"C","text":"C. Trên lĩnh vực tổ chức","correctMarked":false},{"label":"D","text":"D. Trên lĩnh vực chiến đấu","correctMarked":false}],"answerIndex":0,"id":"5-11","sourceKeyMarked":true},{"text":"Tại sao phải giữ vững và tăng cường sự lãnh đạo của Đảng đối với lực lượng vũ trang?","options":[{"label":"A","text":"A. Bảo đảm cho lực lượng vũ trang nhân dân luôn trong tư thế sẵn sàng chiến đấu và hoạt động độc lập với các tổ chức trong hệ thống chính trị","correctMarked":false},{"label":"B","text":"B. Bảo đảm cho lực lượng vũ trang nhân có tinh thần cảnh giác cách mạng và bảo đảm thực hiện tốt nhiệm vụ phát triển kinh tế","correctMarked":false},{"label":"C","text":"C. Bảo đảm cho lực lượng vũ trang nhân giữ vững bản chất cách mạng, mục tiêu, phương hướng chiến đấu","correctMarked":true},{"label":"D","text":"D. Bảo đảm cho lực lượng vũ trang nhân được huấn luyện và rèn luyện tốt, tự quyết định đường lối và nhiệm vụ quốc phòng","correctMarked":false}],"answerIndex":2,"id":"5-12","sourceKeyMarked":true},{"text":"Phương hướng xây dựng lực lượng dân quân tự vệ hiện nay là gì?","options":[{"label":"A","text":"A. Xây dựng rộng khắp","correctMarked":false},{"label":"B","text":"B. Chú trọng cả số lượng và chất lượng","correctMarked":false},{"label":"C","text":"C. Có kế hoạch bồi dưỡng, đào tạo tốt","correctMarked":false},{"label":"D","text":"D. Câu A, B, C đều đúng","correctMarked":true}],"answerIndex":3,"id":"5-13","sourceKeyMarked":true},{"text":"Xây dựng lực lượng vũ trang nhân dân hiện nay có thuận lợi cơ bản gì?","options":[{"label":"A","text":"A. Nước ta có vị thế trên thế giới. Kinh tế, xã hội, quốc phòng, an ninh ngày càng phát triển","correctMarked":false},{"label":"B","text":"B. Đảng có bản lĩnh chính trị vững vàng, tiềm lực, vị thế của nước ta được tăng cường","correctMarked":true},{"label":"C","text":"C. Quân đội, công an ngày càng phát triển lớn mạnh hiện đại","correctMarked":false},{"label":"D","text":"D. Nhà nước quan tâm đầu tư rất mạnh cho quốc phòng và an ninh","correctMarked":false}],"answerIndex":1,"id":"5-14","sourceKeyMarked":true},{"text":"Xây dựng lực lượng vũ trang nhân dân phải tự lực tự cường vì sao?","options":[{"label":"A","text":"A. Để giảm chi phí đầu tư cho quốc phòng, an ninh","correctMarked":false},{"label":"B","text":"B. Để giữ vững tính độc lập tự chủ, không bị chi phối ràng buộc","correctMarked":true},{"label":"C","text":"C. Để xây dựng lực lượng vũ trang có quy mô lớn nhất trong khu vực","correctMarked":false},{"label":"D","text":"D. Để hạn chế hợp tác quốc tế trong lĩnh vực quốc phòng, an ninh","correctMarked":false}],"answerIndex":1,"id":"5-15","sourceKeyMarked":true},{"text":"Đảng Cộng sản Việt Nam lãnh đạo lực lượng vũ trang theo nguyên tắc nào?","options":[{"label":"A","text":"A. Lãnh đạo tuyệt đối, trực tiếp về mọi mặt","correctMarked":true},{"label":"B","text":"B. Hệ thống lãnh đạo từ trung ương đến địa phương","correctMarked":false},{"label":"C","text":"C. Đề ra chủ trương, đường lối lãnh đạo","correctMarked":false},{"label":"D","text":"D. Tập trung dân chủ, phân công cá nhân phụ trách","correctMarked":false}],"answerIndex":0,"id":"5-16","sourceKeyMarked":true},{"text":"Quan điểm, nguyên tắc nào là cơ bản nhất trong xây dựng lực lượng vũ trang nhân dân?","options":[{"label":"A","text":"A. Tự lực tự cường xây dựng lực lượng vũ trang","correctMarked":false},{"label":"B","text":"B. Xây dựng lực lượng vũ trang nhân dân lấy chất lượng là chính, lấy xây dựng chính trị làm cơ sở","correctMarked":false},{"label":"C","text":"C. Giữ vững và tăng cường sự lãnh đạo của Đảng đối với lực lượng vũ trang nhân dân nhân dân","correctMarked":true},{"label":"D","text":"D. Bảo đảm cho lực lượng vũ trang luôn trong tư thế sẵn sàng chiến đấu","correctMarked":false}],"answerIndex":2,"id":"5-17","sourceKeyMarked":true},{"text":"Xây dựng quân đội từng bước hiện đại nhằm mục đích gì?","options":[{"label":"A","text":"A. Bảo đảm khả năng cơ động cho lực lượng vũ trang","correctMarked":false},{"label":"B","text":"B. Nâng cao sức mạnh chiến đấu cho quân đội","correctMarked":true},{"label":"C","text":"C. Bảo đảm cho lực lượng vũ trang giành thắng lợi","correctMarked":false},{"label":"D","text":"D. Bảo đảm cho quân đội hoàn thành nhiệm vụ","correctMarked":false}],"answerIndex":1,"id":"5-18","sourceKeyMarked":true},{"text":"Xây dựng lực lượng vũ trang nhân dân phải đảm bảo luôn trong tư thế sẵn sàng chiến đấu vì?","options":[{"label":"A","text":"A. Đó là nhiệm vụ chủ yếu cơ bản quan trọng của lực lượng vũ trang nhân dân","correctMarked":false},{"label":"B","text":"B. Ngày nay kẻ địch đang luôn tìm cách phá hoại ta công cuộc xây dựng của nhân dân ta","correctMarked":false},{"label":"C","text":"C. Đó là chức năng, nhiệm vụ cơ bản, thường xuyên của lực lượng vũ trang nhân dân","correctMarked":true},{"label":"D","text":"D. Đó là yêu cầu của sự nghiệp cách mạng bảo vệ Tổ quốc hiện nay","correctMarked":false}],"answerIndex":2,"id":"5-19","sourceKeyMarked":true},{"text":"Một trong những phương hướng xây dựng lực lượng vũ trang nhân dân là gì?","options":[{"label":"A","text":"A. Xây dựng lực lượng vũ trang 3 thứ quân theo hướng vững mạnh, đáp ứng tình hình mới","correctMarked":false},{"label":"B","text":"B. Xây dựng quân đội, công an nhân dân theo hướng chính quy, thống nhất, hiện đại","correctMarked":false},{"label":"C","text":"C. Xây dựng quân đội, công an theo hướng cách mạng, chính quy, tinh nhuệ, hiện đại","correctMarked":true},{"label":"D","text":"D. Xây dựng quân đội nhân dân theo hướng chính qui, hiện đại sẵn sàng chiến đấu cao","correctMarked":false}],"answerIndex":2,"id":"5-20","sourceKeyMarked":true},{"text":"Phương hướng xây dựng quân đội nhân dân hiện nay là gì?","options":[{"label":"A","text":"A. Xây dựng Quân đội nhân dân, chính quy, tinh nhuệ, từng bước hiện đại","correctMarked":false},{"label":"B","text":"B. Xây dựng Quân đội nhân dân cách mạng, chính quy, thống nhất từng bước hiện đại","correctMarked":false},{"label":"C","text":"C. Xây dựng Quân đội nhân dân cách mạng, chính quy ,tinh nhuệ, từng bước hiện đại","correctMarked":true},{"label":"D","text":"D. Xây dựng Quân đội nhân dân cách mạng, chính quy, hiện đại có tinh thần quốc tế vô sản","correctMarked":false}],"answerIndex":2,"id":"5-21","sourceKeyMarked":true},{"text":"Xây dựng lực lượng dự bị động viên phải như thế nào?","options":[{"label":"A","text":"A. Có số lượng đông, chất lượng cao, sẳn sàng động viên khi có chiến tranh xâm lược","correctMarked":false},{"label":"B","text":"B. Hùng hậu, huấn luyện và quản lý tốt, đảm bảo khi cần động viên nhanh theo kế hoạch","correctMarked":true},{"label":"C","text":"C. Luôn trong tư thế sẵn sàng chiến đấu, sẳn sàng động viên nhanh chóng theo kế hoạch","correctMarked":false},{"label":"D","text":"D. Phối hợp chặt chẽ với lực lượng thường trực và dân quân tự vệ","correctMarked":false}],"answerIndex":1,"id":"5-22","sourceKeyMarked":true},{"text":"Biện pháp chủ yếu trong xây dựng lực lượng vũ trang nhân dân là:","options":[{"label":"A","text":"A. Nâng cao chất lượng huấn luyện, đẩy mạnh đối ngoại quốc phòng an ninh","correctMarked":false},{"label":"B","text":"B. Nâng cao giáo dục chính trị, tư tưởng, phát triển khoa học công nghệ","correctMarked":false},{"label":"C","text":"C. Nâng cao chất lượng huấn luyện, giáo dục, phối hợp hoạt động giữa các lực lượng vũ trang","correctMarked":false},{"label":"D","text":"D. Nâng cao chất lượng huấn luyện, giáo dục, xây dựng và phát triển khoa học quân sự","correctMarked":true}],"answerIndex":3,"id":"5-23","sourceKeyMarked":true},{"text":"Một trong những biện pháp chủ yếu trong xây dựng lực lượng vũ trang nhân dân là gì?","options":[{"label":"A","text":"A. Từng bước giải quyết yêu cầu về vũ khí cho lực lượng vũ trang nhân dân","correctMarked":false},{"label":"B","text":"B. Từng bước trang bị vũ khí, phương tiện hiện đại cho lực lượng vũ trang nhân dân","correctMarked":false},{"label":"C","text":"C. Từng bước giải quyết yêu cầu về vũ khí, trang bị kỹ thuật cho lực lượng vũ trang nhân dân","correctMarked":true},{"label":"D","text":"D. Từng bước đổi mới bổ sung đầy đủ vũ khí hiện đại cho lực lượng vũ trang nhân dân","correctMarked":false}],"answerIndex":2,"id":"5-24","sourceKeyMarked":true},{"text":"Một biểu hiện về sự lãnh đạo theo nguyên tắc: “Tuyệt đối, trực tiếp về mọi mặt” của Đảng đối với lực lượng vũ trang là gì?","options":[{"label":"A","text":"A. Đảng không chia quyền lãnh đạo lực lượng vũ trang cho bất cứ tổ chức, giai cấp nào trong thời bình","correctMarked":false},{"label":"B","text":"B. Đảng chia sẻ quyền lãnh đạo lực lượng vũ trang cho giai cấp khác khi đất nước khó khăn","correctMarked":false},{"label":"C","text":"C. Đảng không nhường hoặc chia sẻ quyền lãnh đạo lực lượng vũ trang cho bất cứ giai cấp, tổ chức, lực lượng nào","correctMarked":true},{"label":"D","text":"D.  Đảng không nhường quyền lãnh đạo lực lượng vũ trang cho bất cứ lực lượng chính trị nào khác","correctMarked":false}],"answerIndex":2,"id":"5-25","sourceKeyMarked":true},{"text":"Trong đầu tư cho quốc phòng an ninh, xây dựng lực lượng vũ trang nhân dân hiện nay còn một mâu thuẫn chủ yếu giữa:","options":[{"label":"A","text":"A. Nhu cầu hiện đại hóa vũ khí với yêu cầu mở rộng hợp tác quốc phòng quốc tế","correctMarked":false},{"label":"B","text":"B. Nhu cầu nâng cao chất lượng huấn luyện với yêu cầu đổi mới chương trình đào tạo trong quân đội","correctMarked":false},{"label":"C","text":"C. Nhu cầu phải đầu tư cho quốc phòng an ninh, nhưng sức chống chịu và năng lực tự chủ chiến lược của nền kinh tế còn yếu","correctMarked":true},{"label":"D","text":"D. Nhu cầu tăng cường huấn luyện với yêu cầu nâng cao đời sống văn hóa tinh thần của bộ đội","correctMarked":false}],"answerIndex":2,"id":"5-26","sourceKeyMarked":true},{"text":"Lực lượng vũ trang nhân dân Việt Nam gồm tổ chức nào?","options":[{"label":"A","text":"A. Quân đội, Công an, lực lượng dự bị động viên","correctMarked":false},{"label":"B","text":"B. Quân đội, lực lượng dự bị động viên, Dân quân tự vệ","correctMarked":false},{"label":"C","text":"C. Bộ đội chủ lực, Bộ đội địa phương, Dân quân tự vệ","correctMarked":false},{"label":"D","text":"D. Quân đội, Công an, Dân quân tự vệ","correctMarked":true}],"answerIndex":3,"id":"5-27","sourceKeyMarked":true},{"text":"Yếu tố nào sau đây quyết định nhất đến sức mạnh của lực lượng vũ trang?","options":[{"label":"A","text":"A. Chính trị tinh thần","correctMarked":true},{"label":"B","text":"B. Kinh tế","correctMarked":false},{"label":"C","text":"C. Vũ khí trang bị","correctMarked":false},{"label":"D","text":"D. Chỉ huy, taùc chiến","correctMarked":false}],"answerIndex":0,"id":"5-28","sourceKeyMarked":true},{"text":"Xây dựng quân đội, công an phải tinh nhuệ trên các lĩnh vực gì?","options":[{"label":"A","text":"A. Chính trị, tư tưởng, huấn luyện","correctMarked":false},{"label":"B","text":"B. Chính trị, quân sự, hậu cần","correctMarked":false},{"label":"C","text":"C. Chính trị, an ninh, kĩ thuật","correctMarked":false},{"label":"D","text":"D. Chính trị, tổ chức, kĩ chiến thuật","correctMarked":true}],"answerIndex":3,"id":"5-29","sourceKeyMarked":true},{"text":"Chính quy trong quân đội thể hiện ở chỗ nào?","options":[{"label":"A","text":"A. Là sự thống nhất về huấn luyện tác chiến","correctMarked":false},{"label":"B","text":"B. Là sự thống nhất về moị mặt","correctMarked":true},{"label":"C","text":"C. Là sự thống nhất về tổ chức biên chế","correctMarked":false},{"label":"D","text":"D. Là sự thống nhất về nghệ thuật tác chiến","correctMarked":false}],"answerIndex":1,"id":"5-30","sourceKeyMarked":true},{"text":"Một trong những biện pháp xây dựng lực lượng vũ trang nhân dân là gì?","options":[{"label":"A","text":"A. Nâng cao huấn luyện, giáo dục, đẩy mạnh đối ngoại quốc phòng an ninh","correctMarked":false},{"label":"B","text":"B. Nâng cao giáo dục chính trị, tư tưởng, phát triển khoa học công nghệ","correctMarked":false},{"label":"C","text":"C. Nâng cao huấn luyện, giáo dục, phối hợp hoạt động giữa các lực lượng vũ trang","correctMarked":false},{"label":"D","text":"D. Nâng cao huấn luyện, giáo dục, xây dựng và phát triển khoa học quân sự, công an","correctMarked":true}],"answerIndex":3,"id":"5-31","sourceKeyMarked":true},{"text":"Quán triệt nội dung xây dựng lực lượng vũ trang nhân dân cho sinh viên nhằm mục đích gì?","options":[{"label":"A","text":"A. Nâng cao tinh thần trách nhiệm cho sinh viên góp phần xây dựng lực lượng vũ trang vững mạnh","correctMarked":true},{"label":"B","text":"B. Để thực hiện xây dựng nền quốc phòng toàn dân, an ninh nhân dân góp phần bảo vệ Tổ quốc","correctMarked":false},{"label":"C","text":"C. Để bồi dưỡng kiến thức quốc phòng, an ninh cho sinh viên bảo vệ Tổ quốc","correctMarked":false},{"label":"D","text":"D. Để huy động mọi thành phần tham gia xây dựng lực lượng vũ trang","correctMarked":false}],"answerIndex":0,"id":"5-32","sourceKeyMarked":true},{"text":"Lực lượng vũ trang nhân dân Việt Nam là?","options":[{"label":"A","text":"A. Các tổ chức quốc phòng, an ninh","correctMarked":false},{"label":"B","text":"B. Các tổ chức quân sự, an ninh trật tự","correctMarked":false},{"label":"C","text":"C. Các tổ chức vũ trang, tổ chức quần chúng","correctMarked":false},{"label":"D","text":"D. Các tổ chức vũ trang và bán vũ trang","correctMarked":true}],"answerIndex":3,"id":"5-33","sourceKeyMarked":true},{"text":"Vấn đề quan trọng nhất trong xây dựng lực lượng vũ trang nhân dân là gì?","options":[{"label":"A","text":"A. Phát triển số lượng chất lượng Đảng viên trong lực lượng vũ trang","correctMarked":false},{"label":"B","text":"B. Xây dựng đội ngũ cán bộ làm công tác chính trị trong lực lượng vũ trang","correctMarked":false},{"label":"C","text":"C. Giáo dục chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh","correctMarked":false},{"label":"D","text":"D. Giữ vững nguyên tắc Đảng Cộng sản lãnh đạo lực lượng vũ trang","correctMarked":true}],"answerIndex":3,"id":"5-34","sourceKeyMarked":true},{"text":"Trong xây dựng lực lượng vũ trang nhân dân khó khăn lớn của ta là gì?","options":[{"label":"A","text":"A. Nền kinh tế và khoa học công nghệ của đất nước chưa phát triển","correctMarked":false},{"label":"B","text":"B. Kẻ thù có vũ khí hiện đại, thủ đoạn tác chiến trên chiế trường thường xuyên thay đổi","correctMarked":false},{"label":"C","text":"C. Mặt trái của nền kinh tế thị trường tác động rất lớn đến lực lượng vũ trang nhân dân.","correctMarked":false},{"label":"D","text":"D. Chủ nghĩa đế quốc và các thế lực phản động đẩy mạnh chiến lược “Diễn biến hòa bình”","correctMarked":true}],"answerIndex":3,"id":"5-35","sourceKeyMarked":true},{"text":"Thách thức lớn nhất ảnh hưởng đến quá trình xây dựng lực lượng vũ trang nhân dân hiện nay là gì?","options":[{"label":"A","text":"A. Chủ nghĩa đế quốc và kẻ thù của chúng ta ngày càng lớn mạnh","correctMarked":false},{"label":"B","text":"B. Tụt hậu xa hơn về kinh tế, suy thoái về chính trị, tư tưởng , đạo đức","correctMarked":true},{"label":"C","text":"C. Tiềm lực kinh tế khoa học kỹ thuật của đất nước ta còn yếu","correctMarked":false},{"label":"D","text":"D. Trình độ, khả năng sẳn sàng chiến đấu của quân đội còn hạn chế","correctMarked":false}],"answerIndex":1,"id":"5-36","sourceKeyMarked":true},{"text":"Biện pháp chủ yếu xây dựng lực lượng vũ trang nhân dân hiện nay là gì?","options":[{"label":"A","text":"A. Xây dựng đội ngũ cán bộ lực lượng vũ trang có phẩm chất, năng lực tốt","correctMarked":true},{"label":"B","text":"B. Xây dựng đội ngũ cán bộ sĩ quan có trình độ chuyên môn kỹ thuật tốt","correctMarked":false},{"label":"C","text":"C. Xây dựng đội ngũ cán bộ lãnh đạo, chỉ huy có bản lĩnh chính trị vững vàng","correctMarked":false},{"label":"D","text":"D. Xây dựng cán bộ lực lượng vũ trang tuyệt đối trung thành, sẳn sàng chiến đấu","correctMarked":false}],"answerIndex":0,"id":"5-37","sourceKeyMarked":true}]},{"id":6,"title":"Bài 6","questions":[{"text":"Cơ sở lý luận của sự kết hợp kinh tế với quốc phòng - an ninh là gì?","options":[{"label":"A","text":"A. Kinh tế quyết định việc cung ứng vật chất cho quốc phòng – an ninh","correctMarked":false},{"label":"B","text":"B. Kinh tế quyết định việc cung cấp trang thiết bị cho quốc phòng – an ninh","correctMarked":false},{"label":"C","text":"C. Kinh tế quyết định đến nguồn gốc ra đời, sức mạnh của quốc phòng - an ninh","correctMarked":true},{"label":"D","text":"D. Kinh tế quyết định việc cung cấp kỹ thuật, công nghệ cho quốc phòng - an ninh","correctMarked":false}],"answerIndex":2,"id":"6-1","sourceKeyMarked":true},{"text":"Kinh tế và quốc phòng - an ninh có mối quan hệ như thế nào?","options":[{"label":"A","text":"A. Quốc phòng an ninh tạo ra cơ sở vật chất xây dựng kinh tế","correctMarked":false},{"label":"B","text":"B. Quốc phòng an ninh tạo ra những biến động kích thích kinh tế","correctMarked":false},{"label":"C","text":"C. Quốc phòng an ninh và kinh tế có quan hệ, tác động qua lại lẫn nhau","correctMarked":true},{"label":"D","text":"D. Quốc phòng an ninh tạo ra quá trình sự phát triển kinh tế, xã hội","correctMarked":false}],"answerIndex":2,"id":"6-2","sourceKeyMarked":true},{"text":"Mục đích kết hợp phát triển kinh tế với quốc phòng trong giai đoạn hiện nay là gì?","options":[{"label":"A","text":"A. Thực hiện tốt hai nhiệm vụ chiến lược xây dựng và bảo vệ Tổ quốc","correctMarked":true},{"label":"B","text":"B. Thực hiện mục tiêu dân giàu, nước mạnh để bảo vệ vững chắc Tổ quốc","correctMarked":false},{"label":"C","text":"C. Phát triển kinh tế, quốc phòng – an ninh vững mạnh bảo vệ Tổ quốc","correctMarked":false},{"label":"D","text":"D. Nâng cao vị thế, tiềm lực mọi mặt của đất nước","correctMarked":false}],"answerIndex":0,"id":"6-3","sourceKeyMarked":true},{"text":"Quốc phòng là gì?","options":[{"label":"A","text":"A. Là công việc của lực lượng vũ trang nhân dân để bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","correctMarked":false},{"label":"B","text":"B. Là công việc giữ nước của một quốc gia gồm tổng thể các hoạt động đối nội và đối ngoại","correctMarked":true},{"label":"C","text":"C. Là công việc của địa phương nhằm để huy động mọi tiềm lực đất nước bảo vệ tổ quốc","correctMarked":false},{"label":"D","text":"D. Tất cả các câu đều đúng","correctMarked":false}],"answerIndex":1,"id":"6-4","sourceKeyMarked":true},{"text":"Mối quan hệ giữa kinh tế với quốc phòng, an ninh là gì?","options":[{"label":"A","text":"A. Kinh tế quyết định nguồn gốc ra đời, sức mạnh của quốc phòng, an ninh","correctMarked":false},{"label":"B","text":"B. Bản chất của kinh tế-xã hội quyết định bản chất của quốc phòng, an ninh","correctMarked":false},{"label":"C","text":"C. Quốc phòng, an ninh tác động trở lại kinh tế theo hướng tích cực hoặc tiêu cực","correctMarked":false},{"label":"D","text":"D. Câu A, B, C đúng","correctMarked":true}],"answerIndex":3,"id":"6-5","sourceKeyMarked":true},{"text":"Khẳng định: “Thắng lợi hay thất bại của chiến tranh đều phụ thuộc vào kinh tế” là của?","options":[{"label":"A","text":"A. Hồ Chí Minh","correctMarked":false},{"label":"B","text":"B. Ph. Ăngghen","correctMarked":true},{"label":"C","text":"C. V.I.Lênin","correctMarked":false},{"label":"D","text":"D. C.Mác","correctMarked":false}],"answerIndex":1,"id":"6-6","sourceKeyMarked":true},{"text":"“Động vi binh tĩnh vi dân” nghĩa là gì?","options":[{"label":"A","text":"A. Khi đất nước hoà bình làm người lính sẵn sàng chiến đấu","correctMarked":false},{"label":"B","text":"B. Khi đất nước chiến tranh làm người dân phát triển kinh tế","correctMarked":false},{"label":"C","text":"C. Khi đất nước có chiến tranh hoặc bình yên đều phải làm người dân xây dựng, phát triển kinh tế","correctMarked":false},{"label":"D","text":"D. Khi đất nước có chiến tranh làm người lính, đất nước bình yên làm người dân phát triển xây dựng kinh tế","correctMarked":true}],"answerIndex":3,"id":"6-7","sourceKeyMarked":true},{"text":"Kết hợp kinh tế với quốc phòng an ninh trong kháng chiến chống Pháp xâm lược Đảng ta đề ra chủ trương gì?","options":[{"label":"A","text":"A. Vừa tiến hành chiến tranh, vừa củng cố tiềm lực kinh tế","correctMarked":false},{"label":"B","text":"B. Vừa kháng chiến, vừa kiến quốc","correctMarked":true},{"label":"C","text":"C. Vừa tăng gia sản xuất, vừa củng cố quốc phòng.","correctMarked":false},{"label":"D","text":"D. Vừa xây dựng làng kháng chiến, vừa tăng gia lao động sản xuất","correctMarked":false}],"answerIndex":1,"id":"6-8","sourceKeyMarked":true},{"text":"Mục tiêu phát triển kinh tế xã hội trong Văn kiện đại hội Đảng lần thứ XII là gì?","options":[{"label":"A","text":"A. Phấn đấu đến năm 2020 nước ta cơ bản trở thành một nước phát triển theo hướng hiện đại","correctMarked":false},{"label":"B","text":"B. Phấn đấu sớm đưa nước ta cơ bản thành nước công nghiệp theo hướng hiện đại","correctMarked":true},{"label":"C","text":"C. Phấn đấu đưa nước ta cơ bản thành một nước công nghiệp phát triển theo hướng hiện đại","correctMarked":false},{"label":"D","text":"D. Phấn đấu năm 2020 đưa nước ta trở thành một nước công, nông nghiệp theo hướng hiện đại","correctMarked":false}],"answerIndex":1,"id":"6-9","sourceKeyMarked":true},{"text":"Một trong những nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng - an ninh là gì?","options":[{"label":"A","text":"A. Kết hợp trong chiến lược phát triển công nghiệp hóa hiện đại hóa","correctMarked":false},{"label":"B","text":"B. Kết hợp trong chiến lược phát triển nguồn nhân lực để hiện đại hóa đất nước","correctMarked":false},{"label":"C","text":"C. Kết hợp trong xác định chiến lược phát triển kinh tế - xã hội","correctMarked":true},{"label":"D","text":"D. Kết hợp trong xác định chiến lược về văn hóa tư tưởng","correctMarked":false}],"answerIndex":2,"id":"6-10","sourceKeyMarked":true},{"text":"Kết hợp kinh tế với quốc phòng - an ninh trong phát triển các vùng lãnh thổ cần phải  quan tâm vấn đề gì?","options":[{"label":"A","text":"A. Kết hợp chặt chẽ giữa phát triển vùng kinh tế chiến lược, với xây dựng vùng chiến lược quốc phòng an ninh","correctMarked":true},{"label":"B","text":"B. Kết hợp giữa phát triển kinh tế với xây dựng lực lượng vũ trang, lực lượng quần chúng","correctMarked":false},{"label":"C","text":"C. Kết hợp chặt chẽ giữa phát triển công nghiệp quốc phòng với xây dựng các thế trận phòng thủ","correctMarked":false},{"label":"D","text":"D. Kết hợp chặt chẽ giữa phát triển kinh tế với xây dựng các tổ chức chính trị, đoàn thể xã hội","correctMarked":false}],"answerIndex":0,"id":"6-11","sourceKeyMarked":true},{"text":"Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng – an ninh thì lĩnh vực nào đóng vai trò là nền tảng, động lực là quốc sách hàng đầu cho sự phát triển?","options":[{"label":"A","text":"A. Công nghiệp và bưu chính viễn thông","correctMarked":false},{"label":"B","text":"B. Khoa học, công nghệ và giáo dục","correctMarked":true},{"label":"C","text":"C. Giao thông vận tải, công nghiệp","correctMarked":false},{"label":"D","text":"D. Thương mại dịch vụ và y tế","correctMarked":false}],"answerIndex":1,"id":"6-12","sourceKeyMarked":true},{"text":"Kết hợp kinh tế, xã hội với quốc phòng, an ninh ở vùng núi, biên giới, cần tập trung vào những nội dung gì?","options":[{"label":"A","text":"A. Tổ chức tốt việc định canh, định cư tại chỗ, có chính sách điều chỉnh dân số phù hợp","correctMarked":false},{"label":"B","text":"B. Thực hiện tốt chương trình xoá đói, giảm nghèo","correctMarked":false},{"label":"C","text":"C. Kết hợp mọi nguồn lực, mọi lực lượng của cả trung ương và địa phương","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":true}],"answerIndex":3,"id":"6-13","sourceKeyMarked":true},{"text":"Một trong những nội dung kết hợp kinh tế với quốc phòng trong giai  đoạn hiện nay là:","options":[{"label":"A","text":"A. Kết hợp kinh tế với quốc phòng trong các ngành, các lĩnh vực kinh tế chủ yếu","correctMarked":true},{"label":"B","text":"B. Kết hợp kinh tế với quốc phòng trong phân chia các khu vực kinh tế - địa lý","correctMarked":false},{"label":"C","text":"C. Kết hợp kinh tế với quốc phòng giữa các vùng dân cư và vùng kinh tế mới","correctMarked":false},{"label":"D","text":"D. Kết hợp kinh tế với quốc phòng trong phân chia các khu vực kinh tế","correctMarked":false}],"answerIndex":0,"id":"6-14","sourceKeyMarked":true},{"text":"Một trong những nội dung kết hợp kinh tế với quốc phòng - an ninh ở các vùng kinh tế trọng điểm là gì?","options":[{"label":"A","text":"A. Phát triển kinh tế phải đáp ứng nhu cầu dân sinh thời bình và nhu cầu chi viện cho chiến tranh","correctMarked":true},{"label":"B","text":"B. Phát triển kinh tế phải đáp ứng phục vụ nhu cầu dân sinh và nhu cầu dự trữ cơ sở vật chất","correctMarked":false},{"label":"C","text":"C. Phát triển kinh tế phải đáp ứng phục vụ yêu cầu phòng thủ ở từng tỉnh, thành phố","correctMarked":false},{"label":"D","text":"D. Phát triển kinh tế phải đáp ứng phục vụ thỏa mãn đầy đủ nhu cầu dân sinh và nhu cầu quân sự","correctMarked":false}],"answerIndex":0,"id":"6-15","sourceKeyMarked":true},{"text":"Một trong những nội dung kết hợp kinh tế với quốc phòng - an ninh ở vùng biển, đảo cần tập trung vấn đề gì?","options":[{"label":"A","text":"A. Có cơ chế chính sách thoả đáng để động viên khích lệ dân ra đảo bám trụ làm ăn lâu dài","correctMarked":true},{"label":"B","text":"B. Có cơ chế chính sách thoả đáng để động viên dân đầu tư tàu thuyền đánh bắt xa bờ","correctMarked":false},{"label":"C","text":"C. Có cơ chế chính sách thoả đáng để động viên ngư dân thành lập các tổ chức tự vệ trên biển","correctMarked":false},{"label":"D","text":"D. Có cơ chế chính sách thoả đáng để ngư dân xây dựng các trận địa phòng thủ","correctMarked":false}],"answerIndex":0,"id":"6-16","sourceKeyMarked":true},{"text":"Một trong những nội dung kết hợp kinh tế - xã hội với quốc phòng – an ninh trong giai  đoạn hiện nay là gì?","options":[{"label":"A","text":"A. Kết hợp trong thực hiện nhiệm vụ chiến lược bảo vệ Tổ quốc","correctMarked":true},{"label":"B","text":"B. Kết hợp trong thực hiện nhiệm vụ xây dựng quốc phòng toàn dân","correctMarked":false},{"label":"C","text":"C. Kết hợp trong thực hiện xây dựng thế trân quốc phòng, an ninh","correctMarked":false},{"label":"D","text":"D. Kết hợp trong thực hiện phân chia các khu vực kinh tế, quốc phòng","correctMarked":false}],"answerIndex":0,"id":"6-17","sourceKeyMarked":true},{"text":"Một trong các nội dung kết hợp kinh tế với quốc phòng - an ninh trong công nghiệp là gì?","options":[{"label":"A","text":"A. Phải kết hợp ngay từ khi thực hiện xây dựng các khu công nghiệp","correctMarked":false},{"label":"B","text":"B. Phải kết hợp ngay từ khâu quy hoạch, bố trí các đơn vị kinh tế của ngành công nghiệp","correctMarked":true},{"label":"C","text":"C. Phải kết hợp ngay từ khâu quy hoạch chiến lược đào tạo nhân lực của ngành công nghiệp","correctMarked":false},{"label":"D","text":"D. Phải kết hợp ngay trong ý đồ chiến lược bố trí mạng lưới công nghiệp quốc phòng","correctMarked":false}],"answerIndex":1,"id":"6-18","sourceKeyMarked":true},{"text":"“Dựng nước đi đôi với giữ nước” có ý nghĩa gì đối với nước ta ?","options":[{"label":"A","text":"A. Là quy luật tồn tại và phát triển của dân tộc ta","correctMarked":true},{"label":"B","text":"B. Là sự phản ánh quá trình phát triển kinh tế quốc phòng của dân tộc ta","correctMarked":false},{"label":"C","text":"C. Là nhiệm vụ trọng tâm của lực lượng vũ trang trong bảo vệ Tổ quốc","correctMarked":false},{"label":"D","text":"D. Là định hướng phát triển kinh tế gắn với mở rộng quan hệ đối ngoại","correctMarked":false}],"answerIndex":0,"id":"6-19","sourceKeyMarked":true},{"text":"Ông cha ta thực hiện kế sách “ngụ binh ư nông”, “động vi binh, tĩnh vi dân” để làm gì?","options":[{"label":"A","text":"A. Để vừa kháng chiến vừa kiến quốc, vừa chiến đấu vừa tăng gia sản xuất","correctMarked":false},{"label":"B","text":"B. Để vừa phát triển kinh tế, vừa tăng cường sức mạnh quốc phòng bảo vệ Tổ quốc","correctMarked":true},{"label":"C","text":"C. Để nâng cao đời sống cho nhân dân, đồng thời sẵn sàng chống lại kẻ thù xâm lược","correctMarked":false},{"label":"D","text":"D. Vừa phát triển kinh tế, vừa sẵn sàng chống lại kẻ thù xâm lược","correctMarked":false}],"answerIndex":1,"id":"6-20","sourceKeyMarked":true},{"text":"Về kết hợp kinh tế với quốc phòng - an ninh trong lâm nghiệp cần tập trung?","options":[{"label":"A","text":"A. Đẩy mạnh phát triển trồng rừng gắn với công tác định canh định cư xây dựng các cơ sở chính trị","correctMarked":true},{"label":"B","text":"B. Đẩy mạnh khai thác gắn với công tác định canh định cư xây dựng các tổ chức xã hội","correctMarked":false},{"label":"C","text":"C. Đẩy mạnh giảm nghèo vùng núi, phát triển hệ thống giao thông, xây dựng các đoàn thể","correctMarked":false},{"label":"D","text":"D. Đẩy mạnh xóa đói giảm nghèo gắn với công tác luân chuyển dân cư, xây dựng cơ sở chính trị","correctMarked":false}],"answerIndex":0,"id":"6-21","sourceKeyMarked":true},{"text":"Kết hợp kinh tế với quốc phòng - an ninh trong xây dựng công trình cần chú ý gì?","options":[{"label":"A","text":"A. Công trình trọng điểm, quy mô lớn phải tính đến yếu tố tự bảo vệ và sẳn sàng phục vụ cho quốc phòng – an ninh","correctMarked":false},{"label":"B","text":"B. Công trình nào cũng đều phải tính đến yếu tố tự bảo vệ và chuyển hoá phục vụ cho quốc phòng-an ninh","correctMarked":true},{"label":"C","text":"C. Công trình ở các vùng núi, biên giới phải tính đến yếu tố tự bảo vệ và phục vụ cho chiến đấu","correctMarked":false},{"label":"D","text":"D. Công trình trọng điểm, ở vùng kinh tế trọng điểm phải tính đến yếu tố tự bảo vệ","correctMarked":false}],"answerIndex":1,"id":"6-22","sourceKeyMarked":true},{"text":"Một trong những giải pháp để thực hiện kết hợp kinh tế với quốc phòng - an ninh là phải tăng cường?","options":[{"label":"A","text":"A. Sự lãnh đạo của nhà nước, quản lý của Đảng trong thực hiện nhiệm vụ","correctMarked":false},{"label":"B","text":"B. Sự giám sát của quần chúng nhân dân và điều hành của cơ quan chuyên môn","correctMarked":false},{"label":"C","text":"C. Sự lãnh đạo của Đảng, hiệu lực quản lý nhà nước của chính quyền các cấp","correctMarked":true},{"label":"D","text":"D. Sự điều hành quản lý của Nhà nước, giám sát của nhân dân","correctMarked":false}],"answerIndex":2,"id":"6-23","sourceKeyMarked":true},{"text":"Đối tượng bồi dưỡng kiến thức kết hợp phát triển kinh tế - xã hội với quốc phòng - an ninh cần tập trung:","options":[{"label":"A","text":"A. Cán bộ làm công tác kinh tế tại các doanh nghiệp nhà nước và tư nhân","correctMarked":false},{"label":"B","text":"B. Cán bộ chuyên trách về phát triển kinh tế ở cấp xã, phường, đặc khu","correctMarked":false},{"label":"C","text":"C. Cán bộ chủ trì các cấp bộ, ngành, đoàn thể từ trung ương đến cơ sở","correctMarked":true},{"label":"D","text":"D. Học sinh trung học phổ thông, sinh viên cao đẳng, đại học","correctMarked":false}],"answerIndex":2,"id":"6-24","sourceKeyMarked":true},{"text":"Hiện nay nước ta có mấy vùng kinh tế trọng điểm?","options":[{"label":"A","text":"A. 3 vùng","correctMarked":false},{"label":"B","text":"B. 4 vùng","correctMarked":false},{"label":"C","text":"C. 5 vùng","correctMarked":false},{"label":"D","text":"D. 6 vùng","correctMarked":true}],"answerIndex":3,"id":"6-25","sourceKeyMarked":true},{"text":"Kết hợp phát triển kinh tế với tăng cường củng cố quốc phòng an ninh được thể hiện như thế nào?","options":[{"label":"A","text":"A. Trong quá trình phân bổ ngân sách cho quốc phòng, an ninh","correctMarked":false},{"label":"B","text":"B. Ngay trong việc xây dựng chiến lược phát triển kinh tế của quốc gia","correctMarked":false},{"label":"C","text":"C. Khi đất nước chuyển sang tình trạng khẩn cấp về quốc phòng","correctMarked":false},{"label":"D","text":"D. Khi xây dựng các công trình quốc phòng và khu vực phòng thủ","correctMarked":false}],"answerIndex":1,"id":"6-26","sourceKeyMarked":false},{"text":"Kết hợp phát triển kinh tế xã hội với tăng cường, củng cố quốc phòng an ninh trong giao thông vận tải cần phải làm gì?","options":[{"label":"A","text":"A. Xây dựng các công trình giao thông hoành tráng cho thời bình","correctMarked":false},{"label":"B","text":"B. Xây dựng các con đường giao thông nông thôn cho thời chiến","correctMarked":false},{"label":"C","text":"C. Xây dựng kế hoạch động viên giao thông vận tải cho thời chiến","correctMarked":true},{"label":"D","text":"D. Xây dựng các công trình giao thông từng giai đoạn, từng địa phương","correctMarked":false}],"answerIndex":2,"id":"6-27","sourceKeyMarked":true},{"text":"Kết hợp kinh tế với quốc phòng trong xây dựng kết cấu hạ tầng chủ yếu ở ngành nào?","options":[{"label":"A","text":"A. Giao thông vận tải; Bưu chính viễn thông và công nghiệp quốc phòng","correctMarked":false},{"label":"B","text":"B. Giao thông vận tải, Bưu chính viễn thông và xây dựng cơ bản","correctMarked":true},{"label":"C","text":"C. Giao thông vận tải; công nghiệp quốc phòng và vận tải quân sự","correctMarked":false},{"label":"D","text":"D. Giao thông vận tải; công nghiệp quốc phòng, quân sự","correctMarked":false}],"answerIndex":1,"id":"6-28","sourceKeyMarked":true},{"text":"Một trong những nội dung kết hợp phát triển kinh tế - xã hội với tăng cường, củng cố quốc phòng – an ninh ở vùng núi biên giới là gì?","options":[{"label":"A","text":"A. Xây dựng các phương án bảo vệ an ninh chính trị, an ninh trật tự biên giới","correctMarked":false},{"label":"B","text":"B. Xây dựng cơ sở chính trị vững mạnh toàn diện đáp ứng nhiệm vụ bảo vệ Tổ quốc","correctMarked":false},{"label":"C","text":"C. Tổ chức tốt định canh định cư, có chính sách phù hợp để động viên điều chỉnh dân số","correctMarked":true},{"label":"D","text":"D. Xây dựng các khu kinh tế vùng biên giới kết hợp với bảo vệ an ninh chính trị","correctMarked":false}],"answerIndex":2,"id":"6-29","sourceKeyMarked":true},{"text":"Một trong những nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng – an ninh trong khoa học và công nghệ, giáo dục là gì?","options":[{"label":"A","text":"A. Coi trọng giáo dục bồi dưỡng nhân lực, đào tạo nhân tài của đất nước","correctMarked":false},{"label":"B","text":"B. Coi trọng đầu tư phát triển khoa học công nghệ của đất nước","correctMarked":false},{"label":"C","text":"C. Coi trọng đầu tư phát triển khoa học công nghệ quân sự","correctMarked":false},{"label":"D","text":"D. Cả A và B","correctMarked":true}],"answerIndex":3,"id":"6-30","sourceKeyMarked":true},{"text":"Kết hợp kinh tế với quốc phòng, an ninh trong chiến lược phát triển kinh tế - xã hôi được thể hiện ở đâu?","options":[{"label":"A","text":"A. Theo kế hoạch phát triển kinh tế xã hội của Nhà nước","correctMarked":false},{"label":"B","text":"B. Ngay trong việc xây dựng chiến lược phát triển kinh tế của quốc gia","correctMarked":true},{"label":"C","text":"C. Ngay trong kế hoạch củng cố nền quốc phòng toàn dân và xây dựng thế trận chiến tranh nhân dân","correctMarked":false},{"label":"D","text":"D. Ngay trong việc hoạch định chiến lược xây dựng nền quốc phòng toàn dân, an ninh nhân dân","correctMarked":false}],"answerIndex":1,"id":"6-31","sourceKeyMarked":true},{"text":"Thực chất của việc kết hợp phát triển kinh tế với quốc phòng – an ninh là gì?","options":[{"label":"A","text":"A. Thực hiện xây dựng nền quốc phòng toàn dân","correctMarked":false},{"label":"B","text":"B. Thực hiện mục tiêu dân giàu, nước mạnh","correctMarked":false},{"label":"C","text":"C. Thực hiện tốt hai nhiệm vụ chiến lược","correctMarked":true},{"label":"D","text":"D. Phát triển kinh tế, quốc phòng vững mạnh","correctMarked":false}],"answerIndex":2,"id":"6-32","sourceKeyMarked":true},{"text":"Tại sao trong quy hoạch, kế hoach xây dựng các thành phố, các khu công nghiệp cần lựa chọn quy mô trung bình, phân tán, trải dài trên diện rộng ?","options":[{"label":"A","text":"A. Do trình độ khoa học kỹ thuật công nghệ ở nước ta còn hạn chế","correctMarked":false},{"label":"B","text":"B. Để hạn chế hậu quả tiến công hỏa lực của địch khi có chiến tranh","correctMarked":true},{"label":"C","text":"C. Do nước ta còn nghèo chưa đủ trình độ xây dựng các khu công nghiệp lớn","correctMarked":false},{"label":"D","text":"D. Để tận dụng tốt nguồn nhân lực tại chổ cho xây dựng thành phố,khu công nghiệp","correctMarked":false}],"answerIndex":1,"id":"6-33","sourceKeyMarked":true},{"text":"Để thực hiện tốt việc kết hợp phát triển kinh tế xã hội với tăng cường củng cố quốc phòng-an ninh, giải pháp nào là quan trọng nhất?","options":[{"label":"A","text":"A. Xây dựng chiến lược tổng thể kết hợp phát triển kinh tế xã hội với tăng củng cố quốc phòng","correctMarked":false},{"label":"B","text":"B. Tăng cường hiệu lực lãnh đạo của Đảng, quản lý của nhà nước đối với quốc phong an ninh","correctMarked":false},{"label":"C","text":"C. Bồi dưỡng nâng cao kiến thức, kinh nghiệm cho cán bộ chủ trì các cấp, bộ, ngành, đoàn thể","correctMarked":true},{"label":"D","text":"D. Củng cố, kiện toàn phát huy vai trò tham mưu của các cơ quan chuyên trách","correctMarked":false}],"answerIndex":2,"id":"6-34","sourceKeyMarked":true}]},{"id":7,"title":"Bài 7","questions":[{"text":"Trong lịch sử, vì sao nước ta luôn bị nhiều kẻ thù nhòm ngó, đe dọa, tiến công xâm lược?","options":[{"label":"A","text":"A. Việt Nam có vị trí địa lý thuận lợi","correctMarked":true},{"label":"B","text":"B. Việt Nam có nhiều tài nguyên khoáng sản","correctMarked":false},{"label":"C","text":"C. Việt Nam có rừng vàng biển bạc","correctMarked":false},{"label":"D","text":"D. Việt Nam có thị trường to lớn","correctMarked":false}],"answerIndex":0,"id":"7-1","sourceKeyMarked":true},{"text":"Một trong những lý do làm cho cuộc kháng chiến chống quân Minh của nhà Hồ thất bại là vì?","options":[{"label":"A","text":"A. Nhà Hồ chủ trương đánh nhanh, kết thúc chiến tranh trong thời gian ngắn","correctMarked":false},{"label":"B","text":"B. Nhà Hồ đã tích cực tiến công nhưng quân Minh quá mạnh","correctMarked":false},{"label":"C","text":"C. Nhà Hồ quá thiên về phòng thủ, coi đó là phương thức cơ bản","correctMarked":true},{"label":"D","text":"D. Nhà Hồ dựa vào sự viện trợ từ bên ngoài để chống quân Minh","correctMarked":false}],"answerIndex":2,"id":"7-2","sourceKeyMarked":true},{"text":"Lý Thường Kiệt sử dụng biện pháp “Tiên phát chế nhân” nghĩa là gì?","options":[{"label":"A","text":"A. Chuẩn bị chu đáo, chặn đánh địch từ khi mới xâm lược","correctMarked":false},{"label":"B","text":"B. Chuẩn bị thế trậ xt":"D. 3450 km","correctMarked":false}],"answerIndex":0,"id":"8-3","sourceKeyMarked":true},{"text":"Lãnh thổ quốc gia được cấu thành bởi các bộ phận sau:","options":[{"label":"A","text":"A. Vùng đất, vùng biển, vùng trời thuộc lãnh thổ quốc gia","correctMarked":false},{"label":"B","text":"B. Vùng đất, vùng biển, nội địa và vùng nội thuỷ","correctMarked":false},{"label":"C","text":"C. Vùng đất, vùng biển, vùng trời và lãnh thổ quốc gia đặc biệt","correctMarked":true},{"label":"D","text":"D. Vùng đất, vùng lãnh hải và vùng trời","correctMarked":false}],"answerIndex":2,"id":"8-4","sourceKeyMarked":true},{"text":"Vùng nội thuỷ của lãnh thổ quốc gia:","options":[{"label":"A","text":"A. Là vùng nước được giới hạn bởi một bên là bờ biển và một bên khác là lãnh hải","correctMarked":false},{"label":"B","text":"B. Là vùng nước biển nằm ở phía trong của đường cơ sở","correctMarked":true},{"label":"C","text":"C. Là vùng nước nằm ở bên ngoài đường cơ sở","correctMarked":false},{"label":"D","text":"D. Là vùng nước được giới hạn bởi đường cơ sở và đường biên giới trên biển","correctMarked":false}],"answerIndex":1,"id":"8-5","sourceKeyMarked":true},{"text":"Việt Nam có đường bờ biển dài bao nhiêu km?","options":[{"label":"A","text":"A. 3620 km","correctMarked":false},{"label":"B","text":"B. 2360 km","correctMarked":false},{"label":"C","text":"C. 3260 km","correctMarked":true},{"label":"D","text":"D. 3206 km","correctMarked":false}],"answerIndex":2,"id":"8-6","sourceKeyMarked":true},{"text":"Vùng nước lãnh hải của lãnh thổ quốc gia:","options":[{"label":"A","text":"A. Là vùng biển nằm bên ngoài và tiếp liền với vùng tiếp giáp lãnh hải","correctMarked":false},{"label":"B","text":"B. Là vùng biển có chiều rộng 12 hải lý tính từ đường cơ sở","correctMarked":true},{"label":"C","text":"C. Là vùng biển có chiều rộng 12 hải lý tính từ đường cơ sở vào trong","correctMarked":false},{"label":"D","text":"D. Là vùng biển nằm bên ngoài vùng nội thuỷ có chiều rộng 24 hải lý","correctMarked":false}],"answerIndex":1,"id":"8-7","sourceKeyMarked":true},{"text":"Tàu thuyền của các quốc gia khác có được đi lại trong vùng lãnh hải của Việt Nam không?","options":[{"label":"A","text":"A. Không được phép đi lại","correctMarked":false},{"label":"B","text":"B. Được phép đi lại tự do","correctMarked":false},{"label":"C","text":"C. Được phép đi lại khi chính phủ Việt Nam cho phép","correctMarked":false},{"label":"D","text":"D. Được phép đi lại không gây hại","correctMarked":true}],"answerIndex":3,"id":"8-8","sourceKeyMarked":true},{"text":"Quần đảo Trường Sa thuộc tỉnh, thành phố nào của Việt Nam?","options":[{"label":"A","text":"A. Tỉnh An Giang","correctMarked":false},{"label":"B","text":"B. Tỉnh Khánh Hoà","correctMarked":true},{"label":"C","text":"C. Tỉnh Đăk Lăk","correctMarked":false},{"label":"D","text":"D. Thành phố Đà Nẵng","correctMarked":false}],"answerIndex":1,"id":"8-9","sourceKeyMarked":true},{"text":"Quần đảo Hoàng Sa thuộc tỉnh, thành phố và biển nào của Việt Nam?","options":[{"label":"A","text":"A. Thành phố Đà Nẵng, Biển Đông","correctMarked":true},{"label":"B","text":"B. Tỉnh Quảng Ngãi, Biển Đông","correctMarked":false},{"label":"C","text":"C. Tỉnh Quảng Ninh, Vịnh Bắc Bộ","correctMarked":false},{"label":"D","text":"D. Tỉnh Khánh Hoà, Biển Đông","correctMarked":false}],"answerIndex":0,"id":"8-10","sourceKeyMarked":true},{"text":"Thế nào là chủ quyền quốc gia?","options":[{"label":"A","text":"A. Là quyền tối cao của một quốc gia trong phạm vi lãnh thổ của mình","correctMarked":false},{"label":"B","text":"B. Là quyền làm chủ một cách độc lập, toàn vẹn và đầy đủ về mọi mặt lập pháp, hành pháp và tư pháp","correctMarked":true},{"label":"C","text":"C. Là quyền thiêng liêng mọi vấn đề chính trị, kinh tế, văn hoá - xã hội do quốc gia quyết định","correctMarked":false},{"label":"D","text":"D. Là quyền tự quyết định mọi vấn đề đối nội, đối ngoại của quốc gia","correctMarked":false}],"answerIndex":1,"id":"8-11","sourceKeyMarked":true},{"text":"Tác dụng của đường biên giới quốc gia trên biển?","options":[{"label":"A","text":"A. Phân định lãnh thổ trên biển cho tất cả các quốc gia","correctMarked":false},{"label":"B","text":"B. Là ranh giới phía ngoài của vùng đặc quyền kinh tế","correctMarked":false},{"label":"C","text":"C. Là ranh giới phía ngoài của thềm lục địa","correctMarked":false},{"label":"D","text":"D. Phân định lãnh thổ trên biển giữa các quốc gia có bờ biển liền kề hay đối diện nhau","correctMarked":true}],"answerIndex":3,"id":"8-12","sourceKeyMarked":true},{"text":"Luật Biên giới quốc gia của Việt Nam năm 2003 xác định:","options":[{"label":"A","text":"A. Xây dựng biên giới quốc gia là sự nghiệp của toàn dân, của quân đội và công an do Nhà nước thống nhất quản lý","correctMarked":false},{"label":"B","text":"B. Xây dựng, quản lý, bảo vệ biên giới quốc gia, là sự nghiệp của toàn dân do Nhà nước thống nhất quản lý","correctMarked":true},{"label":"C","text":"C. Quản lý, bảo vệ biên giới quốc gia là sự nghiệp của quân đội do Nhà nước thống nhất quản lý","correctMarked":false},{"label":"D","text":"D. Bảo vệ khu vực biên giới là sự nghiệp của toàn dân do Nhà nước thống nhất quản lý","correctMarked":false}],"answerIndex":1,"id":"8-13","sourceKeyMarked":true},{"text":"Đặc trưng cơ bản, quan trọng nhất nhất của một quốc gia là gì?","options":[{"label":"A","text":"A. Quyền lực công cộng nhà nước","correctMarked":false},{"label":"B","text":"B. Chủ quyền lãnh thổ quốc gia","correctMarked":false},{"label":"C","text":"C. Chủ quyền quốc gia","correctMarked":true},{"label":"D","text":"D. Hoà bình, độc lập, tự chủ","correctMarked":false}],"answerIndex":2,"id":"8-14","sourceKeyMarked":true},{"text":"Thế nào là chủ quyền lãnh thổ quốc gia?","options":[{"label":"A","text":"A. Là quyền tối cao, tuyệt đối, riêng biệt đối với quốc gia trên vùng lãnh thổ của mình","correctMarked":false},{"label":"B","text":"B. Là quyền thiêng liêng bất khả xâm phạm của một quốc gia, quyết định mọi vấn đề của quốc gia trên vùng lãnh thổ của mình","correctMarked":false},{"label":"C","text":"C. Là một bộ phận của chủ quyền quốc gia, khẳng định quyền làm chủ của quốc gia đó trên vùng lãnh thổ của mình","correctMarked":true},{"label":"D","text":"D. Là một bộ phận của chủ quyền quốc gia, là quyền quyết định mọi vấn đề chính trị, kinh tế, văn hoá, xã hội","correctMarked":false}],"answerIndex":2,"id":"8-15","sourceKeyMarked":true},{"text":"Biên giới quốc gia trên không được xác định độ cao như thế nào?","options":[{"label":"A","text":"A. Độ cao 100Km","correctMarked":false},{"label":"B","text":"B. Độ cao ngang bầu khí quyễn","correctMarked":false},{"label":"C","text":"C. Độ cao tàu vũ trụ","correctMarked":false},{"label":"D","text":"D. Chưa có quốc gia nào quy định độ cao cụ thể","correctMarked":true}],"answerIndex":3,"id":"8-16","sourceKeyMarked":true},{"text":"Một trong những nội dung xây dựng và bảo vệ chủ quyền lãnh thổ quốc gia:","options":[{"label":"A","text":"A. Xây dựng và phát triển nền quốc phòng toàn dân, an ninh nhân dân","correctMarked":false},{"label":"B","text":"B. Xây dựng và phát triển nền kinh tế kết hợp với quốc phòng - an ninh","correctMarked":false},{"label":"C","text":"C. Xác lập và bảo vệ quyền lập pháp, hành pháp, tư pháp trên mọi mặt","correctMarked":true},{"label":"D","text":"D. Kết hợp chặt chẽ giữa đấu tranh quân sự với bảo đảm an ninh chính trị","correctMarked":false}],"answerIndex":2,"id":"8-17","sourceKeyMarked":true},{"text":"Biên giới quốc gia được cấu thành bởi bộ phận nào sau đây?","options":[{"label":"A","text":"A. Biên giới quốc gia trên đất liền, biên giới quốc gia trên biển và trên không","correctMarked":false},{"label":"B","text":"B. Biên giới quốc gia trong lòng đất và biên giới quốc gia trên biển","correctMarked":false},{"label":"C","text":"C. Biên giới quốc gia trên không, biên giới quốc gia trên biển và trong lòng đất","correctMarked":false},{"label":"D","text":"D. Biên giới quốc gia trên đất liền, trên biển, trên không và trong lòng đất","correctMarked":true}],"answerIndex":3,"id":"8-18","sourceKeyMarked":true},{"text":"Biên giới quốc gia của Việt Nam được xác định bằng yếu tố nào?","options":[{"label":"A","text":"A. Hệ thống các mốc quốc giới trên đất liền, các mốc quốc giới trên biể","correctMarked":false},{"label":"B","text":"B. Hệ thống các mốc quốc giới trên thực địa, các tọa độ trên hải đồ","correctMarked":true},{"label":"C","text":"C. Hệ thống các đường biên giới, các toạ độ trên hải đồ","correctMarked":false},{"label":"D","text":"D. Hệ thống các mốc quốc giới  trên đất liền bằng các tọa độ","correctMarked":false}],"answerIndex":1,"id":"8-19","sourceKeyMarked":true},{"text":"Một trong những nội dung xây dựng và bảo vệ biên giới quốc gia là:","options":[{"label":"A","text":"A. Tăng cường mở rộng quan hệ đối ngoại với các nước láng giềng và trên thế giới","correctMarked":false},{"label":"B","text":"B. Tăng cường hợp tác với các nước trên thế giới vì hoà bình, ổn định và phát triển lâu dài","correctMarked":false},{"label":"C","text":"C. Tăng cường hợp tác phát triển kinh tế, văn hoá, xây dựng lực lượng vũ trang bảo vệ Tổ quốc","correctMarked":false},{"label":"D","text":"D. Tăng cường hợp tác nhiều mặt nhằm xây dựng biên giới hoà bình, hữu nghị, ổn định lâu dài","correctMarked":true}],"answerIndex":3,"id":"8-20","sourceKeyMarked":true},{"text":"Một trong những nội dung xây dựng và bảo vệ biên giới quốc gia:","options":[{"label":"A","text":"A. Phối hợp với các nước trong khu vực ngăn chặn mọi âm mưu gây bạo loạn lật đổ của kẻ thù","correctMarked":false},{"label":"B","text":"B. Phối hợp với các nước đấu tranh ngăn chặn mọi hành động phá hoại tình đoàn kết hữu nghị","correctMarked":true},{"label":"C","text":"C. Phối hợp chặt chẽ giữa chống giặc ngoài và dẹp thù trong để bảo vệ vững chắc Tổ quốc","correctMarked":false},{"label":"D","text":"D. Phối hợp đấu tranh quân sự với bảo đảm an ninh chính trị - trật tự an toàn xã hội","correctMarked":false}],"answerIndex":1,"id":"8-21","sourceKeyMarked":true},{"text":"Một trong những quan điểm của Đảng về xây dựng, bảo vệ chủ quyền lãnh thổ, biên giới quốc gia:","options":[{"label":"A","text":"A. Chủ quyền lãnh thổ, biên giới quốc gia là một bộ phận rất quan trọng của Nhà nước Việt Nam","correctMarked":false},{"label":"B","text":"B. Chủ quyền lãnh thổ, biên giới quốc gia là yếu tố cơ bản nhất cho sự phát triển kinh tế - xã hội","correctMarked":false},{"label":"C","text":"C. Chủ quyền lãnh thổ, biên giới quốc gia là thiêng liêng bất khả xâm phạm của dân tộc Việt Nam","correctMarked":true},{"label":"D","text":"D. Chủ quyền lãnh thổ, biên giới quốc gia là quan trọng trong sự nghiệp xây dựng và bảo vệ Tổ quốc","correctMarked":false}],"answerIndex":2,"id":"8-22","sourceKeyMarked":true},{"text":"Quan điểm xây dựng biên giới hoà bình hữu nghị, ổn định của Đảng và Nhà nước ta thể hiện:","options":[{"label":"A","text":"A. Là vấn đề quan trọng, cơ bản và lâu dài trong sự nghiệp cách mạng của Đảng ta","correctMarked":false},{"label":"B","text":"B. Là quan điểm nhất quán trong sự nghiệp công nghiệp hoá, hiện đại hoá đất nước","correctMarked":false},{"label":"C","text":"C. Là quan điểm nhất quán phù hợp với lợi ích, luật pháp của Việt Nam và công ước quốc tế","correctMarked":true},{"label":"D","text":"D. Là xây dựng biên giới hoà bình, hữu nghị, ổn định phù hợp với đường lối đối ngoại của nước ta","correctMarked":false}],"answerIndex":2,"id":"8-23","sourceKeyMarked":true},{"text":"Để xây dựng và bảo vệ chủ quyền lãnh thổ, biên giới quốc gia. Mọi công dân Việt Nam phải:","options":[{"label":"A","text":"A. Có nghĩa vụ tham gia bảo vệ chủ quyền lãnh thổ khi được cơ quan nhà nước có thẩm quyền huy động","correctMarked":false},{"label":"B","text":"B. Có nghĩa vụ, trách nhiệm tham gia xây dựng và bảo vệ chủ quyền lãnh thổ, biên giới quốc gia","correctMarked":true},{"label":"C","text":"C. Có trách nhiệm vận động nhân dân bảo vệ chủ quyền biển đảo, biên giới quốc gia khi cần thiết","correctMarked":false},{"label":"D","text":"D. Có nghĩa vụ tham gia bảo vệ chủ quyền lãnh thổ, biên giới quốc gia khi xảy ra chiến tranh","correctMarked":false}],"answerIndex":1,"id":"8-24","sourceKeyMarked":true},{"text":"Quan điểm của Đảng, Nhà nước ta trong việc giải quyết các vấn đề tranh chấp lãnh thổ, biên giới:","options":[{"label":"A","text":"A. Vừa hợp tác vừa đấu tranh trong phạm vi lãnh thổ quốc gia của mình","correctMarked":false},{"label":"B","text":"B. Thông qua đàm phán hoà bình, tôn trọng độc lập, chủ quyền toàn vẹn lãnh thổ của nhau","correctMarked":true},{"label":"C","text":"C. Bằng con đường ngoại giao trên tinh thần bình đẳng đôi bên cùng có lợi","correctMarked":false},{"label":"D","text":"D. Kết hợp nhiều biện pháp kể cả biện pháp đe doạ sử dụng vũ lực để giải quyết tranh chấp","correctMarked":false}],"answerIndex":1,"id":"8-25","sourceKeyMarked":true},{"text":"Về vấn đề tranh chấp chủ quyền ở Biển Đông, quan điểm nhất quán của Việt Nam là gì?","options":[{"label":"A","text":"A. Việt Nam khẳng định chủ quyền không thể tranh cãi đối với vùng biển, đảo của Việt Nam trên Biển Đông, trong đó có hai quần đảo Hoàng Sa và Trường Sa","correctMarked":true},{"label":"B","text":"B. Việt Nam khẳng định chủ quyền tuyệt đối với vùng biển, đảo của Việt Nam trên Biển Đông, trong đó có hai quần đảo Hoàng Sa và Trường Sa","correctMarked":false},{"label":"C","text":"C. Việt Nam khẳng định chủ quyền hoàn toàn tuyệt đối với vùng biển, đảo trong đó có hai quần đảo Hoàng Sa và Trường Sa","correctMarked":false},{"label":"D","text":"D. Việt Nam khẳng định chủ quyền thiêng liêng hoàn toàn không cãi đối với vùng biển, đảo của Việt Nam trên Biển Đông","correctMarked":false}],"answerIndex":0,"id":"8-26","sourceKeyMarked":true}]},{"id":9,"title":"Bài 9","questions":[{"text":"Dân quân tự vệ ra đời từ đâu?","options":[{"label":"A","text":"A. Dân quân tự vệ ra đời từ phong trào cách mạng do Đảng phát động","correctMarked":false},{"label":"B","text":"B. Dân quân tự vệ ra đời từ đấu tranh cách mạng của nhân dân ta","correctMarked":false},{"label":"C","text":"C. Dân quân tự vệ ra đời từ phong trào cách mạng của nhân dân do Đảng lãnh đạo","correctMarked":false},{"label":"D","text":"D. Dân quân tự vệ ra đời từ phong trào cách mạng do Đảng xây dựng và lãnh đạo","correctMarked":true}],"answerIndex":3,"id":"9-1","sourceKeyMarked":true},{"text":"Dân quân tự vệ có vai trò gì?","options":[{"label":"A","text":"A. Là một trong những công cụ chủ yếu để bảo vệ địa phương cơ sở","correctMarked":false},{"label":"B","text":"B. Trong thời bình dân quân tự vệ là lực lượng đông đảo tham gia xây dựng kinh tế","correctMarked":false},{"label":"C","text":"C. Trong thời chiến dân quân tự vệ làm nòng cốt cho toàn dân đánh giặc","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":true}],"answerIndex":3,"id":"9-2","sourceKeyMarked":true},{"text":"Ban Chỉ huy quân sự cơ sở của dân quân tự vệ gồm những thành phần nào?","options":[{"label":"A","text":"A. Chỉ huy trưởng; phó chỉ huy trưởng hậu cần","correctMarked":false},{"label":"B","text":"B. Chỉ huy trưởng; chính trị viên và phó chỉ huy trưởng","correctMarked":true},{"label":"C","text":"C. Chỉ huy trưởng; phó chỉ huy trưởng","correctMarked":false},{"label":"D","text":"D. Chỉ huy trưởng; chính trị viên, chỉ huy phó chính trị","correctMarked":false}],"answerIndex":1,"id":"9-3","sourceKeyMarked":true},{"text":"Lực lượng dân quân tự vệ được tổ chức như thế nào:","options":[{"label":"A","text":"A. Lực lượng dự bị và lực lượng rộng rãi","correctMarked":false},{"label":"B","text":"B. Lực lượng nòng cốt và lực lượng rộng rãi","correctMarked":true},{"label":"C","text":"C. Lực lượng quân sự và lực lượng an ninh nhân dân","correctMarked":false},{"label":"D","text":"D. Lực lượng thường trực và lực lượng đánh địch tại chỗ","correctMarked":false}],"answerIndex":1,"id":"9-4","sourceKeyMarked":true},{"text":"Một trong những quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên là phải:","options":[{"label":"A","text":"A. Phát huy sức mạnh của toàn dân tất cả các lĩnh vực hoạt động xã hội","correctMarked":false},{"label":"B","text":"B. Xây dựng lực lượng dự bị động viên hùng mạnh, trình độ kỹ chiến thuật tốt, sẵn sàng chiến đấu cao","correctMarked":false},{"label":"C","text":"C. Phát huy sức mạnh của bộ, ngành và địa phương","correctMarked":false},{"label":"D","text":"D. Phát huy sức mạnh tổng hợp của cả hệ thống chính trị","correctMarked":true}],"answerIndex":3,"id":"9-5","sourceKeyMarked":true},{"text":"Xây dựng lực lượng dự bị động viên bảo đảm giữa số lượng và chất lượng như thế nào?","options":[{"label":"A","text":"A. Số lượng đông, chất lượng cao, phải xây dựng toàn diện","correctMarked":false},{"label":"B","text":"B. Số lượng đủ, chất lượng cao, xây dựng toàn diện nhưng có trọng tâm, trọng điểm","correctMarked":true},{"label":"C","text":"C. Xây dựng toàn diện nhưng có trọng tâm, trọng điểm","correctMarked":false},{"label":"D","text":"D. Số lượng hợp lý, chất lượng cao, nhất là chất lượng chính trị","correctMarked":false}],"answerIndex":1,"id":"9-6","sourceKeyMarked":true},{"text":"Một trong những quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên là:","options":[{"label":"A","text":"A. Bảo đảm số lượng đủ, chất lượng cao toàn diện, rộng khắp, sẵn sàng chiến đấu cao","correctMarked":false},{"label":"B","text":"B. Bảo đảm toàn diện nhưng có trọng điểm chủ yếu xây dựng chất lượng","correctMarked":false},{"label":"C","text":"C. Bảo đảm số lượng đủ, chất lượng cao, đáp ứng được yêu cầu trong mọi tình huống","correctMarked":true},{"label":"D","text":"D. Bảo đảm số lượng hợp lý, chất lượng cao cho những đơn vị sẵn sàng chiến đấu","correctMarked":false}],"answerIndex":2,"id":"9-7","sourceKeyMarked":true},{"text":"Xây dựng lực lượng dân quân tự vệ hiện nay cần lưu ý nhất nội dung nào?","options":[{"label":"A","text":"A.  Xây dựng dân quân tự vệ vững mạnh, coi trọng chất lượng chính trị","correctMarked":true},{"label":"B","text":"B. Xây dựng dân quân tự vệ vững mạnh, rộng khắp coi trọng chất lượng là chính","correctMarked":false},{"label":"C","text":"C. Xây dựng lực lượng dân quân tự vệ vững mạnh, rộng khắp toàn diện có sức chiến đấu cao","correctMarked":false},{"label":"D","text":"D.  Xây dựng lực lượng dân quân tự vệ vững mạnh, rộng khắp, toàn diện","correctMarked":false}],"answerIndex":0,"id":"9-8","sourceKeyMarked":true},{"text":"Xây dựng lực lượng dân quân tự vệ cần chú ý phương châm:","options":[{"label":"A","text":"A. Vững mạnh, rộng khắp, coi trọng chất lượng chính trị","correctMarked":false},{"label":"B","text":"B. Vững mạnh, rộng khắp, coi trọng chất lượng là chính","correctMarked":true},{"label":"C","text":"C. Xây dựng toàn diện sẳn sàng chiến đấu cao","correctMarked":false},{"label":"D","text":"D. Xây dựng toàn diện, coi trọng chất lượng chính trị là chính","correctMarked":false}],"answerIndex":1,"id":"9-9","sourceKeyMarked":true},{"text":"Dân quân tự vệ có nhiệm vụ tăng cường cho quân đội để làm gì?","options":[{"label":"A","text":"A. Luôn bổ sung cho quân đội để chiến đấu và tải thương","correctMarked":false},{"label":"B","text":"B. Bổ sung, phối hợp với quân đội chiến đấu, phục vụ chiến đấu","correctMarked":true},{"label":"C","text":"C. Trực tiếp bổ sung cho quân chủ lực","correctMarked":false},{"label":"D","text":"D. Luôn bổ sung cho quân đội để chiến đấu và tải thương ở hỏa tuyến","correctMarked":false}],"answerIndex":1,"id":"9-10","sourceKeyMarked":true},{"text":"Dân quân tự vệ đặt dưới sự lãnh đạo tuyệt đối trực tiếp về mọi mặt của Đảng vì:","options":[{"label":"A","text":"A. Dân quân tự vệ là một bộ phận của lực lượng vũ trang nhân dân","correctMarked":true},{"label":"B","text":"B. Dân quân tự vệ là lực lượng vũ trang quần chúng nhân dân","correctMarked":false},{"label":"C","text":"C. Dân quân tự vệ là lưc lượng nòng cốt chiến đấu bảo vê địa phương","correctMarked":false},{"label":"D","text":"D. Dân quân tự vệ là lực lượng chiến lược bảo vệ Tổ quốc","correctMarked":false}],"answerIndex":0,"id":"9-11","sourceKeyMarked":true},{"text":"Tổ chức, biên chế đơn vị dự bị động viên phải theo nguyên tắc:","options":[{"label":"A","text":"A. Theo mức độ sức khoẻ, theo tuổi đời và theo cư trú","correctMarked":false},{"label":"B","text":"B. Theo trình độ chuyên môn, theo hạng, theo cư trú","correctMarked":true},{"label":"C","text":"C. Theo quân hàm, theo chức vụ và theo sức khoẻ","correctMarked":false},{"label":"D","text":"D. Theo hạng, theo trình độ văn hoá và theo tuổi đời","correctMarked":false}],"answerIndex":1,"id":"9-12","sourceKeyMarked":true},{"text":"Phương châm vững mạnh trong xây dựng lực lượng dân quân tự vệ là?","options":[{"label":"A","text":"A. Vững mạnh toàn diện về chính trị, tư tưởng, tổ chức","correctMarked":false},{"label":"B","text":"B. Mỗi tổ chức dân quân tự vệ phải luôn vững vàng","correctMarked":true},{"label":"C","text":"C. Xây dựng toàn diện sẵn sàng chiến đấu trong mọi tình huống","correctMarked":false},{"label":"D","text":"D. Xây dựng toàn diện, coi trọng chất lượng chính trị tư tưởng","correctMarked":false}],"answerIndex":1,"id":"9-13","sourceKeyMarked":true},{"text":"Phương châm huấn luyện đối với lực lượng dự bị động viên:","options":[{"label":"A","text":"A. Chất lượng, thiết thực, hiệu quả tập trung vào khoa học quân sự hiện đại","correctMarked":false},{"label":"B","text":"B. Cơ bản, thống nhất coi trọng khâu kỹ thuật tác chiến, phối hợp giữa các lực lượng","correctMarked":false},{"label":"C","text":"C. Chất lượng, thiết thực, hiệu quả, sát thực tế chiến đấu tại địa bàn","correctMarked":false},{"label":"D","text":"D. Chất lượng, thiết thực, hiệu quả, tập trung có trọng tâm, trọng điểm","correctMarked":true}],"answerIndex":3,"id":"9-14","sourceKeyMarked":true},{"text":"Xây dựng lực lượng dự bị động viên phải đặt dưới sự lãnh đạo của Đảng như thế nào?","options":[{"label":"A","text":"A. Trực tiếp, tuyệt đối về mọi mặt","correctMarked":true},{"label":"B","text":"B. Trực tiếp về mọi mặt","correctMarked":false},{"label":"C","text":"C. Tuyệt đối về mọi mặt","correctMarked":false},{"label":"D","text":"D. Toàn diện về mọi mặt","correctMarked":false}],"answerIndex":0,"id":"9-15","sourceKeyMarked":true},{"text":"Một biểu hiện của sức mạnh tổng hợp trong xây dựng lực lượng dự bị động viên là:","options":[{"label":"A","text":"A. Sự chăm lo xây dựng lực lượng dự bị động viên của các địa phương","correctMarked":false},{"label":"B","text":"B. Sự chăm lo xây dựng lực lượng dự bị động viên của Bộ, Nghành","correctMarked":false},{"label":"C","text":"C. Sự chăm lo xây dựng lực lượng dự bị động viên của toàn xã hội","correctMarked":true},{"label":"D","text":"D. Sự chăm lo xây dựng lực lượng dự bị động viên của Bộ Quốc phòng","correctMarked":false}],"answerIndex":2,"id":"9-16","sourceKeyMarked":true},{"text":"Xây dựng lực lượng dự bị động viên là:","options":[{"label":"A","text":"A. Nhiệm vụ quan trọng thường xuyên tất cả các cấp các nghành, của toàn xã hội","correctMarked":false},{"label":"B","text":"B. Nhiệm vụ trọng yếu, thường xuyên của toàn Đảng, toàn quân, toàn dân","correctMarked":true},{"label":"C","text":"C. Nhiệm vụ hệ trọng trong bảo vệ Tổ quốc, bảo vệ nhân dân","correctMarked":false},{"label":"D","text":"D. Nhiệm vụ quan trọng thường xuyên của toàn xã hội và quân đội","correctMarked":false}],"answerIndex":1,"id":"9-17","sourceKeyMarked":true},{"text":"Dân quân tự vệ được bảo đảm hậu cần như thế nào?","options":[{"label":"A","text":"A. Tự cung tự cấp về mọi mặt","correctMarked":false},{"label":"B","text":"B. Được bảo đảm hậu cần tại chỗ","correctMarked":true},{"label":"C","text":"C. Được địa phương bảo đảm về công tác chiến đấu","correctMarked":false},{"label":"D","text":"D. Được địa phương bảo đảm về mọi mặt công tác","correctMarked":false}],"answerIndex":1,"id":"9-18","sourceKeyMarked":true},{"text":"Xây dựng lực lượng dự bị động viên được xác định là nhiệm vụ trọng yếu thường xuyên của lực lượng nào?","options":[{"label":"A","text":"A. Của Bộ quốc phòng, Bộ Công","correctMarked":false},{"label":"B","text":"B. Của toàn xã hội và nhân dân","correctMarked":false},{"label":"C","text":"C. Của Đảng, toàn dân, toàn q g trào để áp dụng khi ra trường đi làm","correctMarked":false},{"label":"C","text":"C. Giúp sinh viên nắm được vị trí, vai trò của phong trào, nêu cao tinh thần trách nhiệm","correctMarked":true},{"label":"D","text":"D. Giúp sinh viên củng cố kiến thức về quốc phòng – an ninh","correctMarked":false}],"answerIndex":2,"id":"10-22","sourceKeyMarked":true},{"text":"Trách nhiệm của sinh viên trong xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc:","options":[{"label":"A","text":"A. Đây là một nhiệm vụ quan trọng sinh viên phải tự giác tham gia","correctMarked":true},{"label":"B","text":"B. Đây là nhiệm vụ chủ yếu mà bắt buộc sinh viên phải tham gia","correctMarked":false},{"label":"C","text":"C. Đây là phong trào sinh viên không nhất thiết phải tham gia","correctMarked":false},{"label":"D","text":"D. Đây là phong trào sinh viên tổ chức tham gia","correctMarked":false}],"answerIndex":0,"id":"10-23","sourceKeyMarked":true}]},{"id":11,"title":"Bài 11","questions":[{"text":"Bảo vệ an ninh quốc gia là gì?","options":[{"label":"A","text":"A. Phòng ngừa, phát hiện, ngăn chặn, đấu tranh làm thất bại các âm mưu và hoạt động xâm phạm an ninh quốc gia","correctMarked":true},{"label":"B","text":"B. Phòng ngừa, phát hiện, ngăn chặn đấu tranh các hành động gây rối của kẻ thù","correctMarked":false},{"label":"C","text":"C. Bảo vệ bí mật Nhà nước và các mục tiêu quan trọng về an ninh quốc gia","correctMarked":false},{"label":"D","text":"D. Bảo vệ các công trình, cơ sở chính trị quốc gia, khoa học công nghệ của Nhà nước","correctMarked":false}],"answerIndex":0,"id":"11-1","sourceKeyMarked":true},{"text":"Một trong những nhiệm vụ bảo vệ an ninh quốc gia là gì?","options":[{"label":"A","text":"A. Phòng ngừa, đấu tranh làm thất bại mọi âm mưu của các lực lượng phản động xâm phạm an ninh quốc gia","correctMarked":false},{"label":"B","text":"B. Phòng ngừa, phát hiện, ngăn chặn, đấu tranh làm thất bại các hoạt động xâm phạm an ninh quốc gia","correctMarked":true},{"label":"C","text":"C. Phòng ngừa, phát hiện, ngăn chặn mọi âm mưu, hành động gây bạo loạn, lật đổ của các thế lực thù địch","correctMarked":false},{"label":"D","text":"D. Phòng ngừa, phát hiện, ngăn chặn xâm phạm biên giới quốc gia của các thế lực thù địch","correctMarked":false}],"answerIndex":1,"id":"11-2","sourceKeyMarked":true},{"text":"Các biện pháp bảo vệ an ninh quốc gia là gì?","options":[{"label":"A","text":"A. Vận động quần chúng","correctMarked":false},{"label":"B","text":"B. Kinh tế, vũ trang","correctMarked":false},{"label":"C","text":"C. Ngoại giao, nghiệp vụ, pháp luật","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":true}],"answerIndex":3,"id":"11-3","sourceKeyMarked":true},{"text":"Một trong những nhiệm vụ bảo vệ an ninh quốc gia là:","options":[{"label":"A","text":"A. Bảo vệ an ninh biên giới, văn hoá, thông tin, tôn giáo","correctMarked":false},{"label":"B","text":"B. Bảo vệ bí mật các tổ chức chính trị - xã hội và các công trình quốc phòng – an ninh","correctMarked":false},{"label":"C","text":"C. Bảo vệ bí mật của Nhà nước và các mục tiêu quan trọng về an ninh quốc gia","correctMarked":true},{"label":"D","text":"D. Bảo vệ bí mật các cấp chính quyền, sự nghiệp công nghiệp hoá, hiện đại hoá đất nước","correctMarked":false}],"answerIndex":2,"id":"11-4","sourceKeyMarked":true},{"text":"Một trong những nguyên tắc bảo vệ an ninh quốc gia là:","options":[{"label":"A","text":"A. Bảo vệ an ninh tư tưởng văn hoá, khối đại đoàn kết dân tộc, quyền lợi của nhân dân","correctMarked":false},{"label":"B","text":"B. Phòng ngừa phát hiện, ngăn chặn làm thất bại các hoạt động xâm phạm an ninh quốc gia","correctMarked":false},{"label":"C","text":"C. Đặt dưới sự lãnh đạo của Đảng Cộng sản Việt Nam, sự quản lý của Nhà nước Cộng hòa Xã hội chủ nghĩa Việt Nam","correctMarked":true},{"label":"D","text":"D. Bảo vệ bí mật của Nhà nước và các mục tiêu quan trọng.","correctMarked":false}],"answerIndex":2,"id":"11-5","sourceKeyMarked":true},{"text":"Bảo vệ an ninh quốc gia cần tuân thủ những nguyên tắc là gì?","options":[{"label":"A","text":"A. Tuân thủ hiến pháp, pháp luật, bảo đảm lợi ích của Nhà nước, của các tổ chức và cá nhân","correctMarked":false},{"label":"B","text":"B. Kết hợp chặt chẽ nhiệm vụ bảo vệ an ninh quốc gia với nhiệm vụ xây dựng phát triển kinh tế, văn hóa, xã hội","correctMarked":false},{"label":"C","text":"C. Đặt dưới sự lãnh đạo của Đảng, sự quản lí thống nhất của Nhà nước","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":true}],"answerIndex":3,"id":"11-6","sourceKeyMarked":true},{"text":"Một trong những nhiệm vụ bảo vệ an ninh quốc gia là:","options":[{"label":"A","text":"A. Bảo vệ an ninh biên giới, văn hoá, thông tin, tôn giáo","correctMarked":false},{"label":"B","text":"B. Bảo vệ bí mật các tổ chức chính trị - xã hội và các công trình quốc phòng – an ninh","correctMarked":false},{"label":"C","text":"C. Bảo vệ an ninh kinh tế, quốc phòng, đối ngoại và các lợi ích khác của quốc gia","correctMarked":true},{"label":"D","text":"D. Bảo vệ bí mật các cấp chính quyền, sự nghiệp công nghiệp hoá, hiện đại hoá đất nước","correctMarked":false}],"answerIndex":2,"id":"11-7","sourceKeyMarked":true},{"text":"Trong sự nghiệp bảo vệ an ninh quốc gia, giữ gìn trật tự an toàn xã hội thì Công an nhân dân được xác định là lực lượng như thế nào?","options":[{"label":"A","text":"A. Lực lượng chủ yếu","correctMarked":false},{"label":"B","text":"B. Lực lượng nòng cốt","correctMarked":true},{"label":"C","text":"C. Lực lượng quan trọng","correctMarked":false},{"label":"D","text":"D. Lực lượng chức năng .","correctMarked":false}],"answerIndex":1,"id":"11-8","sourceKeyMarked":true},{"text":"Lĩnh vực nào sau đây được coi là cốt lõi trong bảo vệ an ninh quốc gia?","options":[{"label":"A","text":"A. An ninh biên giới","correctMarked":false},{"label":"B","text":"B. An ninh chính trị nội bộ","correctMarked":true},{"label":"C","text":"C. An ninh kinh tế","correctMarked":false},{"label":"D","text":"D. An ninh ốc gia thì lĩnh vực nào là quan trọng nhất?","options":[{"label":"A","text":"A. Quốc phòng","correctMarked":false},{"label":"B","text":"B. Tư tưởng - văn hoá","correctMarked":false},{"label":"C","text":"C. Chính trị","correctMarked":true},{"label":"D","text":"D. Đối ngoại","correctMarked":false}],"answerIndex":2,"id":"11-13","sourceKeyMarked":true},{"text":"Trong công tác bảo vệ trật tự an toàn xã hội, lực lượng nào làm nòng cốt?","options":[{"label":"A","text":"A. Công an nhân dân","correctMarked":true},{"label":"B","text":"B. Quân đội nhân dân","correctMarked":false},{"label":"C","text":"C. Quần chúng nhân dân","correctMarked":false},{"label":"D","text":"D. Lực lượng vũ trang","correctMarked":false}],"answerIndex":0,"id":"11-14","sourceKeyMarked":true},{"text":"Đấu tranh giữ gìn trật tự an toàn xã hội là nhiệm vụ của:","options":[{"label":"A","text":"A. Lực lượng Công an nhân dân","correctMarked":false},{"label":"B","text":"B. Lực lượng Quân đội nhân dân","correctMarked":false},{"label":"C","text":"C. Lực lượng cảnh sát 113","correctMarked":false},{"label":"D","text":"D. Toàn Đảng, toàn dân","correctMarked":true}],"answerIndex":3,"id":"11-15","sourceKeyMarked":true},{"text":"Bảo vệ trật tự an toàn xã hội là nhiệm vụ của ai?","options":[{"label":"A","text":"A. Toàn Đảng, toàn dân,toàn quân lực lượng Công an nhân dân giữ vai trò nòng cốt","correctMarked":false},{"label":"B","text":"B. Toàn Đảng, toàn dân, lực lượng Công an nhân dân giữ vai trò nòng cốt","correctMarked":true},{"label":"C","text":"C. Toàn dân, lực lượng Công an nhân dân giữ vai trò nòng cốt","correctMarked":false},{"label":"D","text":"D. Công an, an ninh và lực lượng vũ trang nhân dân","correctMarked":false}],"answerIndex":1,"id":"11-16","sourceKeyMarked":true},{"text":"Hiện nay Việt Nam ta khẳng định đối tác là:","options":[{"label":"A","text":"A. Những quốc gia, vùng lãnh thổ, tổ chức phi Chính phủ tạo điều kiện thuận lợi cho Việt Nam","correctMarked":false},{"label":"B","text":"B. Những nước xã hội chủ nghĩa và các nước đang phát triển giúp đỡ Việt Nam","correctMarked":false},{"label":"C","text":"C. Những ai tôn trọng lợi ích quốc gia - dân tộc, độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ, quan hệ hữu nghị, hợp tác bình đẳng, cùng có lợi, cùng phát triển với Việt Nam","correctMarked":true},{"label":"D","text":"D. Những tổ chức, cá nhân tôn trọng giúp đỡ Việt Nam","correctMarked":false}],"answerIndex":2,"id":"11-17","sourceKeyMarked":true},{"text":"Người có hành vi phạm tội đến tài sản, đến tính mạng sức khỏe... thuộc đối tượng nào?","options":[{"label":"A","text":"A. Đối tượng xâm phạm trật tự, an toàn xã hội","correctMarked":true},{"label":"B","text":"B. Đối tượng xâm phạm an toàn xã hội","correctMarked":false},{"label":"C","text":"C. Đối tượng xâm phạm an ninh trật tự, xã hội","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":false}],"answerIndex":0,"id":"11-18","sourceKeyMarked":true},{"text":"Người có hành vi hoạt động điều tra thu thập thông tin theo chỉ đạo của nước ngoài để chống lại nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, thuộc đối tượng nào?","options":[{"label":"A","text":"A. Phản động","correctMarked":false},{"label":"B","text":"B. Gián điệp","correctMarked":true},{"label":"C","text":"C. Tội phạm an ninh quốc gia","correctMarked":false},{"label":"D","text":"D. Tội phạm hình sự","correctMarked":false}],"answerIndex":1,"id":"11-19","sourceKeyMarked":true},{"text":"Đối tượng xâm phạm đến an ninh quốc gia trong tình hình hiện nay là:","options":[{"label":"A","text":"A. Bọn tội phạm kinh tế, hình sự","correctMarked":false},{"label":"B","text":"B. Bọn gián điệp, bọn phản động","correctMarked":true},{"label":"C","text":"C. Các đối tượng xâm phạm về trật tự an toàn xã hội","correctMarked":false},{"label":"D","text":"D. Các phần tử có tư tưởng sai trái, bất mãn, chống chủ nghĩa xã hội","correctMarked":false}],"answerIndex":1,"id":"11-20","sourceKeyMarked":true},{"text":"“Ngăn chặn các hoạt động truyền bá văn hóa phẩm
