.home-tile .subject-badge{top:clamp(12px,2vh,18px);background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);color:#fff;font-size:11px;font-weight:700;padding:4px 10px}
.home-tile .tile-decoration{color:rgba(255,255,255,.28)}
.bottom-nav-group{background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:24px;padding:6px}
.bottom-nav-item{border:0;border-radius:18px;color:var(--mu)}
.bottom-nav-item:hover{transform:none;background:var(--surface-2)}
.bottom-nav-item.selected,.bottom-nav-item.selected:hover{background:var(--ac-soft);color:var(--ac-tx);box-shadow:none}
.about-button{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:var(--sh);color:var(--ac-tx);border-radius:22px;font-size:clamp(24px,4.5vh,32px);font-weight:800}
.about-button:hover{transform:translateY(-2px)}
.home-modal{background:rgba(10,13,26,.5);backdrop-filter:blur(8px)}
.home-modal-card{background:var(--surface);border:1px solid var(--bd);border-radius:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.modal-close{background:var(--surface-2);color:var(--mu);font-weight:700}
.modal-kicker{color:var(--ac-tx);letter-spacing:.04em;font-weight:700}
.home-modal-card h2{color:var(--tx);font-weight:800}.home-modal-card p{color:var(--mu);font-weight:500}
.modal-action,.button{background:var(--grad);color:#fff;border:0;border-radius:14px;box-shadow:0 12px 24px -10px rgba(99,102,241,.75),inset 0 1px 0 rgba(255,255,255,.25);font-weight:700;letter-spacing:0;padding:14px 26px;text-transform:none;transition:transform .2s,filter .2s}
.button:hover,.modal-action:hover{filter:brightness(1.07);transform:translateY(-1px)}
.button:active,.modal-action:active{transform:scale(.98)}
.button:disabled{background:var(--surface-2);color:var(--mu);box-shadow:none}
.button.secondary,.back-button{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);box-shadow:var(--sh);font-weight:700}
.back-button{border-radius:14px}.back-button:hover{background:var(--surface-2);border-color:var(--bd-2)}
.top-pill{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--bd);box-shadow:none;color:var(--mu);font-weight:600}
.select-wrap select{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);border-radius:14px;box-shadow:none;font-weight:600}
.select-wrap select:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--ring)}
.mode-button{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);border-radius:18px;box-shadow:none;animation:none}
.mode-button:hover{transform:translateY(-1px);background:var(--surface-2)}
.mode-button.active{background:var(--ac-soft);border-color:var(--ac);box-shadow:0 0 0 3px var(--ring)}
.mode-button.active .mode-title{color:var(--ac-tx)}
.mode-icon,.mode-button.exam .mode-icon{background:var(--surface-2);border:0}
.mode-title{font-weight:700}.mode-sub{color:var(--mu);font-weight:500}
body.is-studying #quiz{background:transparent;border:0;box-shadow:none}
body.is-studying .sticky-dashboard{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh)}
.progress{height:10px;background:var(--surface-2);border-radius:99px;overflow:visible}
.progress span{background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899);border-radius:99px;box-shadow:0 0 14px rgba(139,92,246,.55);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-copy{color:var(--mu);font-weight:600}.progress-copy strong{color:var(--tx)}
.score{background:var(--ac-soft);color:var(--ac-tx);border:1px solid var(--ac-bd);font-weight:700}
body.is-studying .question-card.current-question-card,body.is-studying .question-card.current-question-card.answered{background:var(--surface);border:1px solid var(--bd);border-radius:28px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 30px 60px -24px rgba(15,23,42,.28)}
body.is-studying .question-card-preview{background:var(--surface);border:1px solid var(--bd);border-radius:28px;box-shadow:var(--sh)}
.question-card .question-meta{display:inline-flex;padding:4px 10px;border-radius:99px;background:var(--ac-soft);color:var(--ac-tx);font-size:11px;font-weight:700;letter-spacing:.04em}
.question-text{color:var(--tx);font-weight:700}
body.is-studying .question-card.current-question-card .option{background:var(--surface);color:var(--tx);border:1px solid var(--bd-2);border-radius:16px;box-shadow:none;font-weight:500;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}
body.is-studying .question-card.current-question-card .option:hover:not(:disabled):not([aria-disabled=true]):not(.selected):not(.correct):not(.incorrect){border-color:var(--ac-bd);background:var(--ac-soft);transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(99,102,241,.5)}
body.is-studying .question-card.current-question-card .option.selected{background:var(--ac-soft);border-color:var(--ac);box-shadow:0 0 0 3px var(--ring);color:var(--ac-tx);outline:0}
body.is-studying .question-card.current-question-card .option.correct{background:var(--ok-bg);border-color:var(--ok-bd);box-shadow:0 0 0 3px rgba(16,185,129,.18);color:var(--ok-tx);animation:mmPop .35s}
body.is-studying .question-card.current-question-card .option.incorrect{background:var(--bad-bg);border-color:var(--bad-bd);box-shadow:0 0 0 3px rgba(244,63,94,.16);color:var(--bad-tx)}
body.is-studying .question-card.current-question-card .choice-letter{width:32px;height:32px;margin-top:0;background:var(--surface-2);border:0;border-radius:10px;color:var(--mu);font-size:13px;font-weight:700}
body.is-studying .question-card .option.selected .choice-letter{background:var(--ac);color:#fff}
body.is-studying .question-card .option.correct .choice-letter{background:#10b981;color:#fff}
body.is-studying .question-card .option.incorrect .choice-letter{background:#f43f5e;color:#fff}
.question-card .feedback{border-radius:16px;font-weight:600}
.feedback.good{background:var(--ok-bg);color:var(--ok-tx)}.feedback.bad{background:var(--bad-bg);color:var(--bad-tx)}
.result-strip{background:var(--surface);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:20px}
.result-strip strong,.finish-score{color:var(--ac-tx)}.finish-icon{background:var(--ac-soft);color:var(--ac-tx)}
@keyframes mmPop{40%{transform:scale(1.02)}}
@media(max-width:420px){.mm-chip{padding:7px 10px;font-size:13px}.mm-goal{padding-bottom:12px}.home-header{padding:12px 14px;border-radius:24px}}
</style>
</head>

Marked":false},{"label":"C","text":"C. Thiết thực tham gia lao động sản xuất góp phần xây dựng chủ nghĩa xã hội","correctMarked":true},{"label":"D","text":"D. Làm nòng cốt phát triển kinh tế tại nơi đóng quân","correctMarked":false}],"answerIndex":2,"id":"2-22","sourceKeyMarked":true},{"text":"Trong xây dựng bản chất giai cấp cho quân đội, Hồ Chí Minh quan tâm vấn đề gì?","options":[{"label":"A","text":"A. Rất quan tâm đến công tác tổ chức và rèn luyện bản lĩnh chính trị cho quân đội","correctMarked":false},{"label":"B","text":"B. Rất quan tâm đến công tác tư tưởng, tổ chức và rèn luyện tính kỷ luật sẳn sàng chiến đấu","correctMarked":false},{"label":"C","text":"C. Rất quan tâm đến rèn luyện đạo đức, trình độ chuyên môn kỹ chiến thuật","correctMarked":false},{"label":"D","text":"D. Rất quan tâm đến giáo dục, nuôi dưỡng các phẩm chất cách mạng, bản lĩnh chính trị","correctMarked":true}],"answerIndex":3,"id":"2-23","sourceKeyMarked":true},{"text":"Một trong bốn nội dung về lý luận bảo vệ Tổ quốc xã hội chủ nghĩa của Lênin là gì?","options":[{"label":"A","text":"A. Bảo vệ Tổ quốc xã hội chủ nghĩa là nhiệm vụ thường xuyên","correctMarked":false},{"label":"B","text":"B. Bảo vệ Tổ quốc xã hội chủ nghĩa là một tất yếu khách quan","correctMarked":true},{"label":"C","text":"C. Bảo vệ Tổ quốc xã hội chủ nghĩa là cấp thiết trước mắt","correctMarked":false},{"label":"D","text":"D. Bảo vệ Tổ quốc xã hội chủ nghĩa là nhiệm vụ thường xuyên của toàn dân","correctMarked":false}],"answerIndex":1,"id":"2-24","sourceKeyMarked":true},{"text":"Theo quan điểm chủ nghĩa Mác Lênin để bảo vệ tổ quốc Xã hội chủ nghĩa phải làm gì?","options":[{"label":"A","text":"A. Tăng cường quân thường trực gắn với phát triển kinh tế - xã hội","correctMarked":false},{"label":"B","text":"B. Tăng cường thế trận quốc phòng gắn với thực hiện chính sách đối ngoại","correctMarked":false},{"label":"C","text":"C. Tăng cường tiềm lực quốc phòng gắn với phát triển kinh tế - xã hội","correctMarked":true},{"label":"D","text":"D. Tăng cường tiềm lực an ninh gắn với hợp tác quốc tế là nhiệm vụ trọng tâm","correctMarked":false}],"answerIndex":2,"id":"2-25","sourceKeyMarked":true},{"text":"Một trong những nguyên lý cơ bản của chủ nghĩa Mác – Lênin về bảo vệ Tổ quốc xã hội chủ nghĩa?","options":[{"label":"A","text":"A. Quần chúng nhân dân giữ vai trò quan trọng  sự nghiệp bảo vệ tổ quốc xã hội chủ nghĩa","correctMarked":false},{"label":"B","text":"B. Đảng cộng sản lãnh đạo mọi mặt sự nghiệp bảo vệ tổ quốc xã hội chủ nghĩa","correctMarked":true},{"label":"C","text":"C. Lực lượng vũ trang lãnh đạo mọi mặt sự nghiệp bảo vệ tổ quốc xã hội chủ nghĩa","correctMarked":false},{"label":"D","text":"D. Nhà nước lãnh đạo sự nghiệp bảo vệ tổ quốc xã hội chủ nghĩa","correctMarked":false}],"answerIndex":1,"id":"2-26","sourceKeyMarked":true},{"text":"Vai trò lãnh đạo trong bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa thuộc về:","options":[{"label":"A","text":"A. Các đoàn thể, các tổ chức chính trị - xã hội","correctMarked":false},{"label":"B","text":"B. Quần chúng nhân dân, các tổ chức chính trị - xã hội","correctMarked":false},{"label":"C","text":"C. Đảng Cộng sản Việt Nam","correctMarked":true},{"label":"D","text":"D. Mặt trận Tổ quốc Việt Nam, Đoàn Thanh niên","correctMarked":false}],"answerIndex":2,"id":"2-27","sourceKeyMarked":true},{"text":"Chủ tịch Hồ Chí Minh xác định nghĩa vụ, trách nhiệm của công dân về bảo vệ Tổ quốc:","options":[{"label":"A","text":"A. Là trách nhiệm đầu tiên của mọi công dân","correctMarked":false},{"label":"B","text":"B. Là sẵn sàng chiến đấu hy sinh vì Tổ quốc","correctMarked":false},{"label":"C","text":"C. Là nghĩa vụ và trách nhiệm của mọi công dân","correctMarked":true},{"label":"D","text":"D. Là nghĩa vụ của công dân Việt Nam","correctMarked":false}],"answerIndex":2,"id":"2-28","sourceKeyMarked":true},{"text":"Sức mạnh bảo vệ Tổ quốc theo tư tưởng Hồ Chí Minh là gì?","options":[{"label":"A","text":"A. Là sức mạnh chủ yếu của Quân đội nhân dân và Công an nhân dân","correctMarked":false},{"label":"B","text":"B. Là sức mạnh tổng hợp của cả dân tộc, cả nước, kết hợp với sức mạnh thời đại","correctMarked":true},{"label":"C","text":"C. Là sức mạnh của toàn dân của các cấp, các ngành, các tổ chức đoàn thể","correctMarked":false},{"label":"D","text":"D. Là sức mạnh nền quốc phòng toàn dân do nhiều yếu tố, nhân tố tạo thành","correctMarked":false}],"answerIndex":1,"id":"2-29","sourceKeyMarked":true},{"text":"Chủ tịch Hồ Chí Minh xác định vai trò của Đảng trong sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa như thế nào?","options":[{"label":"A","text":"A. Đảng cộng sản Việt Nam chỉ đạo trực tiếp sự nghiệp bảo vệ Tổ quốc","correctMarked":false},{"label":"B","text":"B. Đảng cộng sản Việt Nam là người đi tiên phong trong sự nghiệp bảo vệ Tổ quốc","correctMarked":false},{"label":"C","text":"C. Đảng cộng sản Việt Nam là người kêu gọi mọi tầng lớp nhân dân đứng lên bảo vệ đất nước","correctMarked":false},{"label":"D","text":"D. Đảng cộng sản Việt Nam là người lãnh đạo sự nghiệp bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa","correctMarked":true}],"answerIndex":3,"id":"2-30","sourceKeyMarked":true},{"text":"Theo quan điểm Chủ nghĩa Mác – Lênin chiến tranh là một bộ phận của chính trị, là kết quả phản ánh cái gì?","options":[{"label":"A","text":"A. Bản chất giai cấp của xã hội.","correctMarked":false},{"label":"B","text":"B. Hiện thực khách quan của xã hội","correctMarked":false},{"label":"C","text":"C. Những cố gắng cao nhất của chính trị","correctMarked":true},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":false}],"answerIndex":2,"id":"2-31","sourceKeyMarked":true},{"text":"Theo quan điểm của chủ nghĩ Mác – Lênin chính trị là sự phản ánh tập trung của cái gì?","options":[{"label":"A","text":"A. Kinh tế","correctMarked":true},{"label":"B","text":"B. Xã hội","correctMarked":false},{"label":"C","text":"C. Quốc phòng","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":false}],"answerIndex":0,"id":"2-32","sourceKeyMarked":true},{"text":"Bạo lực cách mạng theo tư tưởng Hồ Chí Minh được tạo bởi:","options":[{"label":"A","text":"A. Sức mạnh của toàn dân, bằng cả lực lượng chính trị và lực lượng vũ trang","correctMarked":true},{"label":"B","text":"B. Sức mạnh của toàn dân, bằng cả lực lượng chính trị và kinh tế","correctMarked":false},{"label":"C","text":"C. Kết hợp chặt chẽ giữa đấu tranh chính trị với đấu tranh kinh tế","correctMarked":false},{"label":"D","text":"D. Kết hợp giữa lực lượng quân sự với viện trợ quốc tế là yếu tố quyết định thắng lợi của cách mạng","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":false}],"answerIndex":0,"id":"2-33","sourceKeyMarked":true},{"text":"Trong những điều kiện xác định, yếu tố nào giữ vai trò quyết định đến sức mạnh chiến đấu của quân đội?","options":[{"label":"A","text":"A. Khoa học công nghệ","correctMarked":false},{"label":"B","text":"B. Chính trị tinh thần","correctMarked":true},{"label":"C","text":"C. Cơ cấu, biên chế, tổ chức quân sự","correctMarked":false},{"label":"D","text":"D. Trang bị kỹ thuật quân sự","correctMarked":false}],"answerIndex":1,"id":"2-34","sourceKeyMarked":true},{"text":"Theo tư tưởng Hồ Chí Minh bảo vệ Tổ quốc Việt Nam Xã hội chủ nghĩa là thế nào?","options":[{"label":"A","text":"A. Quy luật lịch sử","correctMarked":false},{"label":"B","text":"B. Tất yếu khách quan","correctMarked":true},{"label":"C","text":"C. Nhiệm vụ trước mắt trong thời kỳ hòa bình","correctMarked":false},{"label":"D","text":"D. Nhiệm vụ chủ yếu của Quân đội","correctMarked":false}],"answerIndex":1,"id":"2-35","sourceKeyMarked":true},{"text":"Theo tư tưởng Hồ Chí Minh mục tiêu bảo vệ Tổ quốc là gì?","options":[{"label":"A","text":"A. Độc lập dân tộc và phát triển đất nước","correctMarked":false},{"label":"B","text":"B. Độc lập dân tộc và xây dựng đất nước","correctMarked":false},{"label":"C","text":"C. Độc lập dân tộc và Chủ nghĩa xã hội","correctMarked":true},{"label":"D","text":"D. Độc lập dân tộc và bảo vệ lãnh thổ","correctMarked":false}],"answerIndex":2,"id":"2-36","sourceKeyMarked":true},{"text":"Theo tư tưởng Hồ Chí Minh sức mạnh tổng hợp bảo vệ Tổ quốc là như thế nào?","options":[{"label":"A","text":"A. Cả dân tộc, cả nước kết hợp với sức mạnh thời đại","correctMarked":true},{"label":"B","text":"B. Chính trị tinh thần kết hợp với sức mạnh vật chất","correctMarked":false},{"label":"C","text":"C. Kinh tế, xã hội kết hợp với quốc phòng toàn dân","correctMarked":false},{"label":"D","text":"D. Toàn dân kết hợp với lực lượng vũ trang nhân dân","correctMarked":false}],"answerIndex":0,"id":"2-37","sourceKeyMarked":true},{"text":"Mối quan hệ giữa chiến tranh với chính trị theo quan điểm chủ nghĩa Mác Lênin là thế nào?","options":[{"label":"A","text":"A. Chính trị là con đường, là phương tiện của chiến tranh","correctMarked":false},{"label":"B","text":"B. Chính trị là một thời đoạn, một bộ phận của chiến tranh","correctMarked":false},{"label":"C","text":"C. Chính trị chi phối và quyết định toàn bộ tiến trình và kết cục của chiến tranh","correctMarked":true},{"label":"D","text":"D. Chính trị không thể sử dụng kết quả sau chiến tranh để đề ra nhiệm vụ cho giai cấp","correctMarked":false}],"answerIndex":2,"id":"2-38","sourceKeyMarked":true},{"text":"Sức mạnh chiến đấu của quân đội ta theo tư tưởng Hồ Chí Minh là gì?","options":[{"label":"A","text":"A. Là sức mạnh của yếu tố con người và vũ khí trang bị kỹ thuật hiện đại","correctMarked":false},{"label":"B","text":"B. Là sức mạnh của cả dân tộc kết hợp với sức mạnh của thời đại","correctMarked":false},{"label":"C","text":"C. Là sức mạnh tổng hợp trong đó yếu tố con người, chính trị tinh thần giữ vai trò quyết định","correctMarked":true},{"label":"D","text":"D. Là sức mạnh do nhiều yếu tố tạo thành, trong đó yếu tố quân sự an ninh giữ vai trò quyết định","correctMarked":false}],"answerIndex":2,"id":"2-39","sourceKeyMarked":true},{"text":"Vì sao nói chiến tranh là một hiện tượng chính trị - xã hội có tính lịch sử?","options":[{"label":"A","text":"A. Vì chiến tranh là một hành vi bạo lực để buộc đối phương phục tùng ý chí của mình","correctMarked":false},{"label":"B","text":"B. Vì chiến tranh chỉ gắn với những điều kiện lịch sử, xã hội nhất định","correctMarked":true},{"label":"C","text":"C. Vì chiến tranh là sự huy động sức mạnh đến tột cùng của các bên tham chiến","correctMarked":false},{"label":"D","text":"D. Vì chiến tranh được thể hiện dưới một công cụ đặc biệt đó là bạo lực vũ trang","correctMarked":false}],"answerIndex":1,"id":"2-40","sourceKeyMarked":true},{"text":"Theo quan điểm chủ nghĩa Mác – Lênin, bảo vệ Tổ quốc xã hội chủ nghĩa là một tất yếu khách quan vì sao?","options":[{"label":"A","text":"A. Xuất phát từ bản chất âm mưu của kẻ thù và thực tiển cách mạng thế giới","correctMarked":false},{"label":"B","text":"B. Xuất phát từ yêu cầu bảo vệ thành quả cách mạng của giai cấp công nhân","correctMarked":false},{"label":"C","text":"C. Xuất phát từ quy luật phát triển không đều của chủ nghĩa đế quốc","correctMarked":false},{"label":"D","text":"D. Tất cả các câu đều đúng","correctMarked":true}],"answerIndex":3,"id":"2-41","sourceKeyMarked":true},{"text":"Chọn câu sai trong các phát biểu sau về quan hệ giữa chính trị và chiến tranh?","options":[{"label":"A","text":"A. Chính trị chi phối và quyết định toàn bộ tiến trình và kết cục chiến tranh","correctMarked":false},{"label":"B","text":"B. Chiến tranh chi phối và quyết định toàn bộ tiến trình và kết cục chính trị","correctMarked":true},{"label":"C","text":"C. Chiến tranh tác động trở lại chính trị theo hai hướng tích cực hoặc tiêu cực","correctMarked":false},{"label":"D","text":"D. Chiến tranh kiểm tra sức sống của toàn bộ chế độ chính trị xã hội","correctMarked":false}],"answerIndex":1,"id":"2-42","sourceKeyMarked":true},{"text":"Dựa trên cơ sở nào Hồ Chí Minh đã xác định tính chất xã hội của chiến tranh?","options":[{"label":"A","text":"A. Giai cấp lãnh đạo tiến hành chiến tranh","correctMarked":false},{"label":"B","text":"B. Chế độ xã hội tiến hành chiến tranh","correctMarked":false},{"label":"C","text":"C. Mục đích chính trị của chiến tranh","correctMarked":true},{"label":"D","text":"D. Bản chất xã hội của chiến tranh","correctMarked":false}],"answerIndex":2,"id":"2-43","sourceKeyMarked":true},{"text":"Yếu tố nào có vai trò quyết định đến sức mạnh chiến đấu của quân đội?","options":[{"label":"A","text":"A. Khoa học công nghệ","correctMarked":false},{"label":"B","text":"B. Chính trị tinh thần","correctMarked":true},{"label":"C","text":"C. Biên chế, tổ chức","correctMarked":false},{"label":"D","text":"D. Trang bị kỹ thuật quân sự","correctMarked":false}],"answerIndex":1,"id":"2-44","sourceKeyMarked":true}]},{"id":3,"title":"Bài 3","questions":[{"text":"Đảng ta khẳng định vị trí của nền quốc phòng toàn dân, an ninh nhân dân như thế nào?","options":[{"label":"A","text":"A. Luôn luôn coi trọng quốc phòng – an ninh, coi đó là nhiệm vụ quan trọng","correctMarked":false},{"label":"B","text":"B. Luôn luôn coi trọng quốc phòng – an ninh, coi đó là nhiệm vụ chủ yếu quan trọng hàng đầu","correctMarked":false},{"label":"C","text":"C. Luôn luôn coi trọng quốc phòng – an ninh, coi đó là nhiệm vụ chiến lược gắn bó chặt chẻ","correctMarked":true},{"label":"D","text":"D. Luôn luôn coi trọng quốc phòng – an ninh, coi đó là nhiệm vụ trọng tâm","correctMarked":false}],"answerIndex":2,"id":"3-1","sourceKeyMarked":true},{"text":"Một trong những đặc trưng của nền quốc phòng toàn dân, an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Nền Quốc phòng – An ninh của dân, do dân, vì dân","correctMarked":true},{"label":"B","text":"B. Nền Quốc phòng – An ninh mang tính giai cấp, nhân dân sâu sắc","correctMarked":false},{"label":"C","text":"C. Nền Quốc phòng – An ninh bảo vệ quyền lợi của dân","correctMarked":false},{"label":"D","text":"D. Nền Quốc phòng – An ninh do nhân dân xây dựng, mang tính nhân dân sâu sắc","correctMarked":false}],"answerIndex":0,"id":"3-2","sourceKeyMarked":true},{"text":"Sức mạnh của nền quốc phòng toàn dân, an ninh nhân dân ở nước ta là thế nào?","options":[{"label":"A","text":"A. Sức mạnh do các yếu tố chính trị, kinh tế, văn hóa, khoa học","correctMarked":false},{"label":"B","text":"B. Sức mạnh tổng hợp do thiên thời địa lợi nhân hòa tạo ra","correctMarked":false},{"label":"C","text":"C. Sức mạnh của lực lượng vũ trang nhân dân tạo ra","correctMarked":false},{"label":"D","text":"D. Sức mạnh tổng hợp do nhiều yếu tố tạo thành","correctMarked":true}],"answerIndex":3,"id":"3-3","sourceKeyMarked":true},{"text":"Nền Quốc phòng toàn dân , an ninh nhân dân có đặc trưng gì?","options":[{"label":"A","text":"A. Chỉ có mục đích duy nhất là tự vệ chính đáng","correctMarked":false},{"label":"B","text":"B. Đó là nền quốc phòng của dân, do dân, vì dân","correctMarked":false},{"label":"C","text":"C. Nền quốc phòng, an ninh do các bộ , các ngành xây dựng","correctMarked":false},{"label":"D","text":"D. Cả A và B đều đúng","correctMarked":true}],"answerIndex":3,"id":"3-4","sourceKeyMarked":true},{"text":"Dựa trên cơ sở nào xác định tính chất toàn dân của nền quốc phòng toàn dân?","options":[{"label":"A","text":"A. Từ bài học kinh nghiệm trong xây dựng lực lượng vũ trang nhân dân","correctMarked":false},{"label":"B","text":"B. Từ truyền thống dân tộc ta trong chiến đấu chống giặc ngoại xâm","correctMarked":false},{"label":"C","text":"C. Từ truyền thống dân tộc ta trong sự nghiệp dựng nước và giữ nước","correctMarked":true},{"label":"D","text":"D. Từ truyền thống của cha, ông ta trong chiến đấu chống thực dân xâm lược","correctMarked":false}],"answerIndex":2,"id":"3-5","sourceKeyMarked":true},{"text":"Tính toàn diện của nền quốc phòng,an ninh nhân dân được thể hiện như thế nào?","options":[{"label":"A","text":"A. Xây dựng nền quốc phòng an ninh bằng sức mạnh của mọi cấp, mọi ngành, mọi địa phương","correctMarked":true},{"label":"B","text":"B. Xây dựng nền quốc phòng , an ninh bằng sức mạnh tổng hợp của cả hệ thống chính trị  và các đoàn thể","correctMarked":false},{"label":"C","text":"C. Xây dựng nền quốc phòng bằng sức mạnh quân sự to lớn, kinh tế phát triển vững mạnh","correctMarked":false},{"label":"D","text":"D. Xây dựng nền quốc phòng bằng sức mạnh của nền kinh tế, quân sự an ninh","correctMarked":false}],"answerIndex":0,"id":"3-6","sourceKeyMarked":true},{"text":"Một trong những mục đích xây dựng nền quốc phòng toàn dân, an ninh nhân dân vững mạnh là gì?","options":[{"label":"A","text":"A. Tạo thế chủ động cho sự nghiệp xây dựng và bảo vệ Tổ quốc","correctMarked":true},{"label":"B","text":"B. Tạo ra những cơ sở vật chất nâng cao mức sống cho lực lượng vũ trang","correctMarked":false},{"label":"C","text":"C. Tạo ra tiềm lực quân sự để phòng thủ đất nước","correctMarked":false},{"label":"D","text":"D. Tạo ra môi trường hòa bình để phát triển đất nước theo định hướng xã hội chủ nghĩa","correctMarked":false}],"answerIndex":0,"id":"3-7","sourceKeyMarked":true},{"text":"Hai nhiệm vụ chiến lược của cách mạng Việt Nam hiện nay là gì?","options":[{"label":"A","text":"A. Xây dựng phát triển kinh tế và quốc phòng","correctMarked":false},{"label":"B","text":"B. Xây dựng đất nước và bảo vệ tổ quốc","correctMarked":false},{"label":"C","text":"C. Xây dựng chủ nghĩa xã hội và bảo vệ tổ quốc xã hội chủ nghĩa","correctMarked":true},{"label":"D","text":"D. Xây dựng phát triển kinh tế và quốc phòng – an ninh nhân dân","correctMarked":false}],"answerIndex":2,"id":"3-8","sourceKeyMarked":true},{"text":"Vị trí mối quan hệ giữa hai nhiệm vụ chiến lược hiện nay như thế nào?","options":[{"label":"A","text":"A. Trong khi đặt trọng tâm vào nhiệm vụ xây dựng chủ nghĩa xã hội chúng ta không một chút lơi lỏng nhiệm vụ bảo vệ Tổ quốc","correctMarked":true},{"label":"B","text":"B. Quan hệ khăng khít tác động qua lại tạo điều kiện cho nhau, nhiệm vụ xây dựng phát triển kinh tế là hàng đầu","correctMarked":false},{"label":"C","text":"C. Quan hệ đan chen tác động qua lại lẫn nhau, nhiệm vụ xây dựng Chủ nghĩa xã hội là quyết định","correctMarked":false},{"label":"D","text":"D. Trong khi đặt trọng tâm vào nhiệm vụ xây dựng chủ nghĩa xã hội cần củng cố và xây dựng lực lượng vũ trang nhân hùng mạnh để bảo vệ Tổ quốc","correctMarked":false}],"answerIndex":0,"id":"3-9","sourceKeyMarked":true},{"text":"Tiềm lực quốc phòng, an ninh là gì?","options":[{"label":"A","text":"A. Khả năng vật chất và tinh thần của lực lượng vũ trang nhân dân","correctMarked":false},{"label":"B","text":"B. Khả năng về nhân lực, vật lực, tài chính có thể huy động để bảo vệ Tổ quốc","correctMarked":true},{"label":"C","text":"C. Khả năng cung cấp cơ sở vật chất và trình độ khoa học công nghệ của đất nước","correctMarked":false},{"label":"D","text":"D. Khả năng huy động sức người, sức của để bảo vệ Tổ quốc","correctMarked":false}],"answerIndex":1,"id":"3-10","sourceKeyMarked":true},{"text":"Biểu hiện của tiềm lực chính trị, tinh thần là gì?","options":[{"label":"A","text":"A. Là nhân tố quyết định trực tiếp trình độ phát triển kinh tế của đất nước","correctMarked":false},{"label":"B","text":"B. Là nhân tố cơ bản tạo nên sức mạnh quốc phòng, an ninh nhân dân","correctMarked":false},{"label":"C","text":"C. Ý chí, quyết tâm của nhân dân, của các lực lượng vũ trang nhân dân","correctMarked":true},{"label":"D","text":"D. Trình độ học vấn, chuyên môn kỹ thuật của nhân dân và lực lượng vũ trang","correctMarked":false}],"answerIndex":2,"id":"3-11","sourceKeyMarked":true},{"text":"Nội dung xây dựng nền quốc phòng toàn dân – an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Xây dựng nền dân chủ Xã hội Chủ nghĩa","correctMarked":false},{"label":"B","text":"B. Xây dựng và củng cố tổ chức Đảng, nhà nước và các đoàn thể chính trị, xã hội","correctMarked":false},{"label":"C","text":"C. Xây dựng tiềm lực và thế trận quốc phòng - an ninh","correctMarked":true},{"label":"D","text":"D. Xây dựng khối đại đoàn kết toàn dân tộc","correctMarked":false}],"answerIndex":2,"id":"3-12","sourceKeyMarked":true},{"text":"Nền quốc phòng toàn dân – an ninh nhân dân gồm những lực lượng nào?","options":[{"label":"A","text":"A. Lực lượng toàn dân, lực lượng vũ trang nhân dân","correctMarked":true},{"label":"B","text":"B. Lực lượng quân đội nhân dân và công an nhân dân","correctMarked":false},{"label":"C","text":"C. Lực lượng toàn dân và dân quân tự vệ","correctMarked":false},{"label":"D","text":"D. Lực lượng vũ trang nhân dân do Đảng lãnh đạo","correctMarked":false}],"answerIndex":0,"id":"3-13","sourceKeyMarked":true},{"text":"Trong củng cố xây dựng nền quốc phòng, an ninh nhân dân, lực lượng nào là nòng cốt?","options":[{"label":"A","text":"A. Lực lượng quân đội nhân dân và công an nhân dân","correctMarked":false},{"label":"B","text":"B. Quân chúng nhân dân lao động và an ninh nhân dân","correctMarked":false},{"label":"C","text":"C. Bộ đội chủ lực, bộ đội địa phương và dân quân tự vệ","correctMarked":true},{"label":"D","text":"D. Lực lượng quân đội, công an và an ninh nhân dân","correctMarked":false}],"answerIndex":2,"id":"3-14","sourceKeyMarked":true},{"text":"Xây dựng lực lượng quốc phòng - an ninh là xây dựng cái gì?","options":[{"label":"A","text":"A. Xây dựng thế trận quốc phòng toàn dân và khu vực phòng thủ vững chắc","correctMarked":false},{"label":"B","text":"B. Xây dựng lực lượng chính trị và lực lượng vũ trang nhân dân","correctMarked":true},{"label":"C","text":"C. Xây dựng thế trận quốc phòng và thế trận an ninh nhân dân","correctMarked":false},{"label":"D","text":"D. Xây dựng nền quốc phòng toàn dân gắn với thế trận an ninh nhân dân","correctMarked":false}],"answerIndex":1,"id":"3-15","sourceKeyMarked":true},{"text":"Nội dung xây dựng tiềm lực kinh tế của nền quốc phòng toàn dân:","options":[{"label":"A","text":"A. Xây dựng nền công nghiệp, nông nghiệp phục vụ chủ yếu cho quốc phòng","correctMarked":false},{"label":"B","text":"B. Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước, xây dựng nền kinh tế độc lập tự chủ","correctMarked":true},{"label":"C","text":"C. Xây dựng nền công nghiệp, lấy công nghiệp nặng làm then chốt","correctMarked":false},{"label":"D","text":"D. Xây dựng nền công nghiệp quốc phòng an ninh làm nền tảng phát triển kinh tế quốc dân","correctMarked":false}],"answerIndex":1,"id":"3-16","sourceKeyMarked":true},{"text":"Tiềm lực quốc phòng - an ninh được thể hiện ở tất cả các lĩnh vực đời sống xã hội nhưng cần tập trung cái gì?","options":[{"label":"A","text":"A. Tiềm lực chính trị, tinh thần, khoa học và công nghệ","correctMarked":false},{"label":"B","text":"B. Tiềm lực kinh tế, quân sự, an ninh","correctMarked":false},{"label":"C","text":"C. Tiềm lực công nghiệp quốc phòng, khoa học quân sự","correctMarked":false},{"label":"D","text":"D. Cả A và B","correctMarked":true}],"answerIndex":3,"id":"3-17","sourceKeyMarked":true},{"text":"Xây dựng tiềm lực kinh tế của nền quốc phòng toàn dân cần đặc biệt quan tâm nội dung nào?","options":[{"label":"A","text":"A. Đẩy mạnh công nghiệp hoá hiện đại hoá đất nước","correctMarked":true},{"label":"B","text":"B. Phát triển toàn diện tất cả các ngành, các lĩnh vực kinh tế","correctMarked":false},{"label":"C","text":"C. Không ngừng cải thiện đời sống vật chất, tinh thần cho các lực lượng vũ trang","correctMarked":false},{"label":"D","text":"D. Có kế hoạch chuyển sản xuất từ thời bình sang thời chiến","correctMarked":false}],"answerIndex":0,"id":"3-18","sourceKeyMarked":true},{"text":"Xây dựng tiềm lực khoa học công nghệ của nền quốc phòng toàn dân - an ninh nhân dân là tạo nên cái gì?","options":[{"label":"A","text":"A. Tạo nên khả năng về vũ khí trang bị kỹ thuật hiện đại để phòng thủ đất nước","correctMarked":false},{"label":"B","text":"B. Tạo nên khả năng về khoa học, công nghệ của quốc gia có thể khai thác, phục vụ quốc phòng – an ninh","correctMarked":true},{"label":"C","text":"C. Tạo nên khả năng huy động đội ngũ cán bộ khoa học kỹ thuật của quốc gia phục vụ quốc phòng an ninh","correctMarked":false},{"label":"D","text":"D. Tạo ra khả năng ứng dụng kết quả nghiên cứu khoa học công nghệ vào quốc phòng – an ninh","correctMarked":false}],"answerIndex":1,"id":"3-19","sourceKeyMarked":true},{"text":"Tiềm lực chính trị, tinh thần là gì trong nội dung xây dựng nền quốc phòng – an ninh?","options":[{"label":"A","text":"A. Là khả năng về chính trị, tinh thần của xã hội để thực hiện nhiệm vụ quốc phòng","correctMarked":false},{"label":"B","text":"B. Là khả năng về chính trị, tinh thần chiến đấu chống quân xâm lược của nhân dân","correctMarked":false},{"label":"C","text":"C. Là khả năng về chính trị, tinh thần có thể huy động nhằm tạo thành sức mạnh để thực hiện nhiệm vụ quốc phòng – an ninh","correctMarked":true},{"label":"D","text":"D. Là khả năng về chính trị, tinh thần tiềm ẩn của nhân dân chưa được huy động để thực hiện nhiệm vụ quốc phòng – an ninh","correctMarked":false}],"answerIndex":2,"id":"3-20","sourceKeyMarked":true},{"text":"Một trong các nội dung xây dựng nền quốc phòng toàn dân, an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Xây dựng thế trận quốc phòng toàn dân và chiến tranh nhân dân","correctMarked":false},{"label":"B","text":"B. Xây dựng thế trận quốc phòng , an ninh nhân dân","correctMarked":true},{"label":"C","text":"C. Xây dựng thế bố trí lực lượng quốc phòng toàn dân","correctMarked":false},{"label":"D","text":"D. Xây dựng thế trận quốc phòng hiện đại của các quân binh chủng","correctMarked":false}],"answerIndex":1,"id":"3-21","sourceKeyMarked":true},{"text":"Một trong những nội dung xây dựng tiềm lực quân sự, an ninh là gì?","options":[{"label":"A","text":"A. Kết hợp chặt chẽ xây dựng thế trận quốc phòng và chiến tranh nhân dân","correctMarked":false},{"label":"B","text":"B. Kết hợp chặt chẽ giữa chống thù trong và diệt giặc bên ngoài","correctMarked":false},{"label":"C","text":"C. Kết hợp chặt chẽ xây dựng thế trận an ninh nhân dân với thế trân chiến tranh nhân dân","correctMarked":false},{"label":"D","text":"D. Gắn công nghiệp hóa, hiện đại hóa đất nước với tăng cường vũ khí trang bị cho lực lượng vũ trang","correctMarked":true}],"answerIndex":3,"id":"3-22","sourceKeyMarked":true},{"text":"Một trong những quan điểm xây dựng nền quốc phòng toàn dân, an ninh nhân dân được rút ra từ thực tiễn đấu tranh cách mạng là gì?","options":[{"label":"A","text":"A. Quan điểm phát huy sức mạnh nội lực của nền kinh tế","correctMarked":false},{"label":"B","text":"B. Quan điểm tranh thủ sự giúp đở quốc tế","correctMarked":false},{"label":"C","text":"C. Quan điểm phát huy sức mạnh tổng hợp","correctMarked":true},{"label":"D","text":"D. Quan điểm dựa vào nền kinh tế thị trường định hướng xã hội chủ nghĩa","correctMarked":false}],"answerIndex":2,"id":"3-23","sourceKeyMarked":true},{"text":"Một trong những nội dung xây dựng thế trận quốc phòng, an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Tổ chức phòng thủ dân sự, kết hợp cải tạo địa hình với xây dựng hạ tầng và các công trình quốc phòng, an ninh","correctMarked":true},{"label":"B","text":"B. Tổ chức phòng thủ dân sự gắn với mở rộng các khu đô thị và phát triển dịch vụ thương mại","correctMarked":false},{"label":"C","text":"C. Tổ chức phòng thủ dân sự, xây dựng các công trình ẩn nấp chủ động tiến công tiêu diệt địch","correctMarked":false},{"label":"D","text":"D. Tổ chức phòng thủ dân sự nhằm bảo đảm an toàn cho người, tài sản và khắc phục hậu quả thiên tai","correctMarked":false}],"answerIndex":0,"id":"3-24","sourceKeyMarked":true},{"text":"Một trong những nội dung xây dựng thế trận quốc phòng, an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Phân vùng chiến lược về quốc phòng – an ninh kết hợp với vùng kinh tế","correctMarked":true},{"label":"B","text":"B. Phân vùng chiến lược về quốc phòng – an ninh kết hợp với quy hoạch dân cư","correctMarked":false},{"label":"C","text":"C. Phân vùng chiến lược về quốc phòng – an ninh kết hợp xây dựng các phương án phòng thủ","correctMarked":false},{"label":"D","text":"D. Phân vùng chiến lược về quốc phòng – an ninh kết hợp với bảo toàn lực lượng","correctMarked":false}],"answerIndex":0,"id":"3-25","sourceKeyMarked":true},{"text":"Một trong những nội dung về tăng cường giáo dục quốc phòng – an ninh là gì?","options":[{"label":"A","text":"A. Giáo dục về âm mưu thủ đoạn, hành động chống phá cách mạng của chủ nghĩa đế quốc","correctMarked":false},{"label":"B","text":"B. Giáo dục về âm mưu, bản chất hiếu chiến xâm lược của kẻ thù đối với dân tộc ta","correctMarked":false},{"label":"C","text":"C. Giáo dục về âm mưu, thủ đoạn của kẻ thù khi tiến hành chiến tranh xâm lược","correctMarked":false},{"label":"D","text":"D. Giáo dục để mọi người nhận rõ âm mưu, thủ đoạn của các thế lực thù địch đối với cách mạng","correctMarked":true}],"answerIndex":3,"id":"3-26","sourceKeyMarked":true},{"text":"Biện pháp xây dựng nền quốc phòng toàn dân, an ninh nhân dân gì?","options":[{"label":"A","text":"A. Thường xuyên thực hiện giáo dục quốc phòng - an ninh","correctMarked":true},{"label":"B","text":"B. Thường xuyên củng cố quốc phòng và hiện đại hoá lực lượng vũ trang","correctMarked":false},{"label":"C","text":"C. Thường xuyên chăm lo xây dựng lực lượng vũ trang nhân dân theo yêu cầu","correctMarked":false},{"label":"D","text":"D. Thường xuyên chăm lo xây dựng Công an nhân dân vững mạnh","correctMarked":false}],"answerIndex":0,"id":"3-27","sourceKeyMarked":true},{"text":"Xây dựng nền quốc phòng toàn dân, an ninh nhân dân có quan điểm nào rút ra từ thực tiễn lịch sử của đất nước?","options":[{"label":"A","text":"A. Quan điểm tìm sự hỗ trợ, đầu tư từ nước ngoài","correctMarked":false},{"label":"B","text":"B. Quan điểm độc lập tự chủ, tự lực, tự cường","correctMarked":true},{"label":"C","text":"C. Quan điểm mở rộng, tư do hoá nền kinh tế thị trường","correctMarked":false},{"label":"D","text":"D. Quan điểm tư nhân hoá nền kinh tế đất nước","correctMarked":false}],"answerIndex":1,"id":"3-28","sourceKeyMarked":true},{"text":"Một trong những quan điểm cơ bản xây dựng nền quốc phòng toàn dân, an ninh nhân dân là:","options":[{"label":"A","text":"A. Tự lực tự cường và kết hợp với yếu tố nước ngoài","correctMarked":false},{"label":"B","text":"B. Toàn dân, toàn diện, độc lập, tự chủ, tự lực, tự cường","correctMarked":true},{"label":"C","text":"C. Dựa vào dân và sức mạnh truyền thống","correctMarked":false},{"label":"D","text":"D. Tự lực cánh sinh kết hợp với sức mạnh quốc phòng","correctMarked":false}],"answerIndex":1,"id":"3-29","sourceKeyMarked":true},{"text":"Nội dung giáo dục quốc phòng, an ninh phải toàn diện nhưng phải coi trọng?","options":[{"label":"A","text":"A. Giáo dục quan điểm đường lối chính sách của Đảng, nhà nước","correctMarked":false},{"label":"B","text":"B. Giáo dục tình hình nhiệm vụ của cách mạng giai đoạn hiện nay","correctMarked":false},{"label":"C","text":"C. Giáo dục tình yêu quê hương, đất nước, chế độ xã hội chủ nghĩa","correctMarked":true},{"label":"D","text":"D. Giáo dục tình hình nhiệm vụ quân sự - an ninh nhân dân","correctMarked":false}],"answerIndex":2,"id":"3-30","sourceKeyMarked":true},{"text":"Một trong những biện pháp xây dựng nền quốc phòng toàn dân - an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Thường xuyên thực hiện giáo dục ý thức trách nhiệm của công dân","correctMarked":false},{"label":"B","text":"B. Thường xuyên thực hiện giáo dục nghĩa vụ công dân","correctMarked":false},{"label":"C","text":"C. Thường xuyên thực hiện giáo dục quốc phòng - an ninh","correctMarked":true},{"label":"D","text":"D. Thường xuyên thực hiện nhiệm vụ chiến lược của đất nước","correctMarked":false}],"answerIndex":2,"id":"3-31","sourceKeyMarked":true},{"text":"Một trong những nhiệm vụ xây dựng nền quốc phòng toàn dân, an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Xây dựng lực lượng vũ trang nhân dân vững mạnh","correctMarked":false},{"label":"B","text":"B. Xây dựng lực lượng quốc phòng an ninh vững mạnh","correctMarked":true},{"label":"C","text":"C. Xây dựng lực lượng công an, quân đội vững mạnh","correctMarked":false},{"label":"D","text":"D. Xây dựng tiềm lực quốc phòng, an ninh vững mạnh","correctMarked":false}],"answerIndex":1,"id":"3-32","sourceKeyMarked":true},{"text":"Tiềm lực kinh tế trong nội dung xây dựng nền quốc phòng, an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Khả năng khoa học công nghệ và tài chính để phục vụ nhiệm vụ quốc phòng, an ninh","correctMarked":false},{"label":"B","text":"B. Khả năng về khoa học kỹ thuật để phục vụ nhiệm vụ quốc phòng an ninh","correctMarked":false},{"label":"C","text":"C. Khả năng về kinh tế của đất nước có thể khai thác, huy động nhằm phục vụ cho quốc phòng – an ninh","correctMarked":true},{"label":"D","text":"D. Khả năng về chính trị, tài chính và khoa học - công nghệ của đất nước phục vụ quốc phòng, an ninh","correctMarked":false}],"answerIndex":2,"id":"3-33","sourceKeyMarked":true},{"text":"Nền quốc phòng toàn dân, an ninh nhân dân chỉ có mục đích duy nhất là gì?","options":[{"label":"A","text":"A. Tự vệ chính đáng","correctMarked":true},{"label":"B","text":"B. Sẳn sàng chiến đấu","correctMarked":false},{"label":"C","text":"C. Xây dựng vững mạnh","correctMarked":false},{"label":"D","text":"D. Chính quy, hiện đại","correctMarked":false}],"answerIndex":0,"id":"3-34","sourceKeyMarked":true},{"text":"Một trong những đặc trưng của nền quốc phòng toàn dân, an ninh nhân dân là gì?","options":[{"label":"A","text":"A. Nền quốc phòng toàn dân gắn chặt với nền an ninh nhân dân","correctMarked":true},{"label":"B","text":"B. Nền quốc phòng toàn dân gắn chặt với sư phát triển kinh tế chính trị.","correctMarked":false},{"label":"C","text":"C. Nền quốc phòng toàn dân gắn chặt với chế độ chính trị-xã hội","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":false}],"answerIndex":0,"id":"3-35","sourceKeyMarked":true},{"text":"Một trong những nội dung xây dựng tiềm lực quân sự, an ninh là gì?","options":[{"label":"A","text":"A. Xây dựng lực lượng Quân đội Công an vững mạnh","correctMarked":false},{"label":"B","text":"B. Xây dựng thế trận chiến tranh nhân dân vững chắc","correctMarked":false},{"label":"C","text":"C. Xây dựng lực lượng dân quân tự vệ đảm bảo số lượng","correctMarked":false},{"label":"D","text":"D. Xây dựng lực lượng vũ trang nhân dân vững mạnh toàn diện","correctMarked":true}],"answerIndex":3,"id":"3-36","sourceKeyMarked":true},{"text":"Biện pháp \"Thường xuyên thực hiện giáo dục quốc phòng-an ninh\" trong xây dựng nền quốc phòng toàn dân, an ninh nhân dân có tác động gì?","options":[{"label":"A","text":"A. Tác động tích cực đến nhận thức của toàn dân trong sự nghiệp xây dựng và bảo vệ Tổ quốc","correctMarked":false},{"label":"B","text":"B. Làm cho mọi người, mọi tổ chức biết tự bảo vệ trước sự chống phá của các thế lực thù địch","correctMarked":true},{"label":"C","text":"C. Tác động mạnh mẽ đến ý chí, tinh thần trong xây dựng lực lượng vũ trang nhân dân","correctMarked":false},{"label":"D","text":"D.Tác động trực tiếp đến trình độ nhận thức của toàn dân về quốc phòng","correctMarked":false}],"answerIndex":1,"id":"3-37","sourceKeyMarked":true}]},{"id":4,"title":"Bài 4","questions":[{"text":"Đối tượng tác chiến của chiến tranh nhân dân bảo vệ Tổ quốc là?","options":[{"label":"A","text":"A. Chủ nghĩa đế quốc và chủ nghĩa ly khai","correctMarked":false},{"label":"B","text":"B. Chủ nghĩa đế quốc và các thế lực phản động","correctMarked":true},{"label":"C","text":"C. Các thế lực phản cách mạng trong và ngoài nước","correctMarked":false},{"label":"D","text":"D. Chủ nghĩa khủng bố quốc tế","correctMarked":false}],"answerIndex":1,"id":"4-1","sourceKeyMarked":true},{"text":"Tiến hành chiến tranh xâm lược nước ta, khó khăn cơ bản của địch là gì?","options":[{"label":"A","text":"A. Phải đương đầu với một dân tộc có truyền thống kiên cường bất khuất chống giặc ngoại xâm","correctMarked":false},{"label":"B","text":"B. Tiến hành một cuộc chiến tranh phi nghĩa sẽ bị thế giới lên án","correctMarked":false},{"label":"C","text":"C. Phải tác chiến trong điều kiện địa hình, thời tiết phức tạp","correctMarked":false},{"label":"D","text":"D. Tất cả đều đúng","correctMarked":true}],"answerIndex":3,"id":"4-2","sou ndex":2,"id":"4-24","sourceKeyMarked":true},{"text":"Thế trận chiến tranh nhân dân là gì?","options":[{"label":"A","text":"A. Sự tổ chức, bố trí lực lượng để tiến hành chiến tranh và hoạt động tác chiến","correctMarked":true},{"label":"B","text":"B. Sự tổ chức, bố trí, các lực lượng vũ trang nhân dân để đánh giặc giữ nước","correctMarked":false},{"label":"C","text":"C. Sự tổ chức, bố trí lực lượng vũ trang nhân dân để phòng thủ đất nước","correctMarked":false},{"label":"D","text":"D. Sự tổ chức, bố trí các lực lượng chiến đấu trên chiến trường","correctMarked":false}],"answerIndex":0,"id":"4-25","sourceKeyMarked":true},{"text":"Chiến tranh nhân dân bảo vệ Tổ quốc, thế trận chiến tranh được bố trí như thế nào?","options":[{"label":"A","text":"A. Bố trí rộng trên cả nước, tập trung ở khu vực chủ yếu","correctMarked":false},{"label":"B","text":"B. Bố trí rộng trên cả nước, nhưng phải có trọng tâm trọng điểm","correctMarked":true},{"label":"C","text":"C. Bố trí rộng trên cả nước, tập trung ở các vùng kinh tế trọng điểm","correctMarked":false},{"label":"D","text":"D. Bố trí rộng trên cả nước, tập trung ở các địa bàn trọng điểm","correctMarked":false}],"answerIndex":1,"id":"4-26","sourceKeyMarked":true},{"text":"Lực lượng trong chiến tranh nhân dân bảo vệ Tổ quốc bao gồm?","options":[{"label":"A","text":"A. Lực lượng Quân đội nhân dân và Công an nhân dân","correctMarked":false},{"label":"B","text":"B. Lực lượng vũ trang nhân dân gồm ba thứ quân làm nòng cốt","correctMarked":true},{"label":"C","text":"C. Lực lượng thường trực của Quân đội nhân dân kết hợp với lực lượng dự bị động viên","correctMarked":false},{"label":"D","text":"D. Lực lượng dự bị động viên và dân quân tự vệ là chủ yếu","correctMarked":false}],"answerIndex":1,"id":"4-27","sourceKeyMarked":true},{"text":"Ta phải làm gì để chống quân địch tiến công từ bên ngoài và bạo loạn lật đổ từ bên trong?","options":[{"label":"A","text":"A. Phải vừa đấu tranh quân sự trên chiến trường vừa trấn áp địch ở hậu phương","cor
