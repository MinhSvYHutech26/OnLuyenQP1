const mascotImages = Object.fromEntries(['happy', 'encouraging', 'studying', 'thinking', 'sad', 'angry', 'tired', 'cheering'].map(expression => [expression, slimoMascot]));
function setMascotExpression(expression='happy') {
  const name=mascotImages[expression]?expression:'happy';
  lastMascotExpression=name;
  [homeMascot,studyMascot,modalMascot,...document.querySelectorAll('.tile-mascot')].forEach(image=>{
    if(!image)return;
    image.src=mascotImages[name];
    image.classList.remove('mascot-react');
    void image.offsetWidth;
    image.classList.add('mascot-react');
  });
}
function openQuizSetup(nextMode) {
  setMode(nextMode);
  homeModal.classList.remove('about-open');
  homeQuizSetup.hidden=false;
  document.getElementById('homeModalText').hidden=true;
  document.getElementById('homeModalAction').hidden=true;
  document.getElementById('homeModalKicker').textContent=nextMode==='exam'?'THI THỬ':'ÔN TẬP';
  document.getElementById('homeModalTitle').textContent=nextMode==='exam'?`Thi thử ${subjectLabel()}`:`Chọn cách ôn ${subjectLabel()}`;
  setMascotExpression(nextMode==='exam'?'encouraging':'studying');
  homeModal.hidden=false;
  document.getElementById(selectedSubject === 'qp' ? 'bank' : 'scope').focus();
}

  const slot=Math.max(64,stageHeight/2-maxCardHeight*fitScale*.43-12);
  stage.querySelectorAll('.coverflow-card').forEach(card=>{
    const cardIndex=Number(card.dataset.questionIndex);
    const relative=cardIndex-activeQuestionIndex-progress;
    const distance=Math.abs(relative);
    const scale=(distance<=1?1.16-.44*distance:Math.max(.42,.72-.27*(distance-1)))*fitScale;
    const opacity=distance<=1?1-.3*distance:Math.max(0,.7-.75*(distance-1));
    const focus=Math.max(0,1-distance);
    const target=card.classList.contains('answered')?[70,163,2]:[120,217,87];
    const channel=(start,end)=>Math.round(start+(end-start)*focus);
    card.style.borderColor=`rgb(${channel(216,target[0])},${channel(216,target[1])},${channel(216,target[2])})`;
    card.style.boxShadow=`0 ${4+6*focus}px 0 rgba(223,244,213,${focus}),0 ${22*focus}px ${44*focus}px rgba(45,117,23,${.18*focus})`;
    const y=relative*slot;

    card.style.opacity=String(opacity);
    card.style.zIndex=String(Math.round(20-distance*4)+(relative>0?1:0));
    card.style.filter=distance<.5?'blur(0)':`blur(${Math.min(1.4,(distance-.5)*.6)}px)`;
    card.style.pointerEvents=distance<1.55?'auto':'none';
  });
}

window.addEventListener('pointercancel',event=>{if(touchStart&&event.pointerId===touchStart.pointerId){touchStart=null;gestureProgress=0;settleCoverflow(0,0);}});
quiz.addEventListener('wheel', event => {
  if(!event.target.closest('.question-stage')||Math.abs(event.deltaX)>Math.abs(event.deltaY))return;
  if(Math.abs(event.deltaY)<1)return;
  event.preventDefault();
  clearTimeout(wheelTimer);
  if(transitionLocked||touchStart||Date.now()<wheelCooldownUntil)return;
  const multiplier=event.deltaMode===1?32:event.deltaMode===2?(questionStage?.clientHeight||500):1;
  wheelAccum=Math.max(-160,Math.min(160,wheelAccum+event.deltaY*multiplier));
  const progress=wheelAccum>0?.18:-.18;
  if(Math.abs(wheelAccum)>=24)applyCoverflow(progress,false);
  wheelTimer=setTimeout(()=>{
    const amount=wheelAccum;wheelAccum=0;
    if(transitionLocked||touchStart)return;
    if(Math.abs(amount)>=24){
      const direction=amount>0?1:-1;
      wheelCooldownUntil=Date.now()+760;
      settleCoverflow(activeQuestionIndex+direction>=0&&activeQuestionIndex+direction<questionQueue.length?direction:0,progress);
    }else settleCoverflow(0,0);
  },145);
},{passive:false});
window.addEventListener('resize',()=>{if(!transitionLocked&&activeScreen===studyScreen&&!studyScreen.hidden)layoutCoverflowStage();},{passive:true});

<script>
(()=>{const $=id=>document.getElementById(id),K='mm_stats',G=20,R=document.documentElement;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const toast=m=>{let t=$('mmToast');if(!t){t=document.createElement('div');t.id='mmToast';t.className='mm-toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)};
const meta=document.querySelector('meta[name=theme-color]');
const theme=t=>{R.dataset.theme=t;if(meta)meta.content=t==='dark'?'#0a0d1a':'#f4f6fb'};
theme(R.dataset.theme||'light');
$('mmTheme').onclick=()=>{const t=R.dataset.theme==='dark'?'light':'dark';ls.set('mm_theme',t);theme(t)};
$('mmShare').onclick=async()=>{const u=location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:document.title,text:'Ôn trắc nghiệm miễn phí, học ngay trên điện thoại!',url:u});else{await navigator.clipboard.writeText(u);toast('Đã sao chép liên kết')}}catch(e){}};
const d=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(),now=()=>d(new Date()),prev=()=>{const x=new Date();x.setDate(x.getDate()-1);return d(x)};
let S={streak:0,last:'',total:0,day:'',n:0,seen:[]};try{Object.assign(S,JSON.parse(ls.get(K)||'{}'))}catch(e){}
const roll=()=>{if(S.day!==now()){S.day=now();S.n=0;S.seen=[]}if(S.last&&S.last!==now()&&S.last!==prev())S.streak=0};
const draw=()=>{roll();$('mmStreak').querySelector('b').textContent=S.streak;const g=$('mmGoal');g.querySelector('b').textContent=S.n;g.style.setProperty('--p',Math.min(100,S.n/G*100)+'%');g.classList.toggle('done',S.n>=G)};
const hash=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
const rec=()=>{const c=document.querySelector('.question-card.current-question-card.answered'),q=c&&c.querySelector('.question-text');if(!q)return;roll();const k=hash(q.textContent);if(S.seen.includes(k))return;S.seen.push(k);S.n++;S.total++;if(S.last!==now()){S.streak=S.last===prev()?S.streak+1:1;S.last=now()}ls.set(K,JSON.stringify(S));draw();if(S.n===G)toast('Đạt mục tiêu hôm nay! 🎉')};
const qz=$('quiz');let raf=0;if(qz)new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(rec)}).observe(qz,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
draw();
const pn=document.querySelector('[data-home-nav=progress]');
if(pn)pn.addEventListener('click',()=>{roll();const s=(i,v)=>{const e=$(i);if(e)e.textContent=v};s('homeModalKicker','Tiến độ của bạn');s('homeModalTitle',S.streak+' ngày học liên tiếp');s('homeModalText','Hôm nay bạn đã làm '+S.n+'/'+G+' câu. Tổng cộng '+S.total+' câu. Học đều mỗi ngày để giữ chuỗi nhé!')});
})();
</script>
<!-- THƯ VIỆN ĐỌC FILE .DOCX TRỰC TIẾP TRÊN TRÌNH DUYỆT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- MODULE TỰ ĐỘNG NHẬN DIỆN ĐỀ TRIẾT & BỐC 50 CÂU PHÂN BỔ ĐỀU 3 BÀI -->
<script>
(function() {
  const DOCX_FILENAME = "Ngan_hang_trac_nghiem_Triet_hoc_451_cau.docx";
  let philPool = { 1: [], 2: [], 3: [] };
  let isPhilLoaded = false;
  let isPhilLoading = false;

  // 1. Chuyển giao diện thẻ Triết học sang trạng thái "Sẵn sàng"
  const philTile = document.querySelector('[data-home-action="philosophy"]');
  if (philTile) {
    const badge = philTile.querySelector('.subject-badge');
    if (badge) {
      badge.textContent = "Sẵn sàng";
      badge.classList.remove('badge-soon');
      badge.classList.add('badge-ready');
    }
    const desc = philTile.querySelector('p');
    if (desc) desc.textContent = "Thi thử 50 câu · Phân bổ đều 3 bài";
  }

  // 2. Hàm phân loại câu hỏi về đúng 3 Chương/Bài dựa trên mã thẻ [tag] và từ khóa
  function detectLessonGroup(tag, questionText) {
    const t = (tag || "").toUpperCase();
    // Chương 1: Khái luận về Triết học và Triết học Mác - Lênin
    if (t.includes("S03") || t.includes("P1-") || t.includes("KTRA1") || t.includes("VIDEO")) return 1;
    // Chương 2: Chủ nghĩa duy vật biện chứng
    if (t.includes("S02") || t.includes("P2-") || t.includes("BO2")) return 2;
    // Chương 3: Chủ nghĩa duy vật lịch sử
    if (t.includes("S01") || t.includes("P3-")) return 3;

    // Dự phòng bằng từ khóa nếu câu không khớp tag
    const q = questionText.toLowerCase();
    if (/lực lượng sản xuất|quan hệ sản xuất|cơ sở hạ tầng|kiến trúc thượng tầng|giai cấp|nhà nước|hình thái kinh tế|quần chúng nhân dân/.test(q)) return 3;
    if (/thế giới quan|vấn đề cơ bản của triết học|bất khả tri|khả tri|cổ điển đức|phoi-ơ-bắc|hêghen/.test(q)) return 1;
    return 2;
  }

  // 3. Hàm đọc và bóc tách 451 câu hỏi từ file .docx
  async function loadPhilosophyDocx() {
    if (isPhilLoaded) return true;
    if (isPhilLoading) return false;
    isPhilLoading = true;

    try {
      const response = await fetch(DOCX_FILENAME);
      if (!response.ok) throw new Error("Không tìm thấy file " + DOCX_FILENAME + " trên GitHub!");
      const arrayBuffer = await response.arrayBuffer();
      const zip = await JSZip.loadAsync(arrayBuffer);
      const xmlText = await zip.file("word/document.xml").async("string");

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const paragraphs = xmlDoc.getElementsByTagName("w:p");

      const lines = [];
      for (let i = 0; i < paragraphs.length; i++) {
        const texts = paragraphs[i].getElementsByTagName("w:t");
        let line = "";
        for (let j = 0; j < texts.length; j++) {
          line += texts[j].textContent;
        }
        line = line.trim();
        if (line) lines.push(line);
      }

      // Bước 3.1: Đọc "Phần 2. Bảng đáp án nhanh" ở cuối file để đối chiếu chính xác 100%
      const answerKeyMap = {};
      let inAnswerTable = false;
      for (const line of lines) {
        if (line.includes("Phần 2. Bảng đáp án nhanh")) inAnswerTable = true;
        if (inAnswerTable) {
          const matches = [...line.matchAll(/(\d+)\s+([A-D])/g)];
          for (const m of matches) {
            answerKeyMap[parseInt(m[1], 10)] = m[2];
          }
        }
      }

      // Bước 3.2: Bóc tách từng câu hỏi, các phương án A B C D và dấu ✓
      philPool = { 1: [], 2: [], 3: [] };
      let currentQ = null;

      for (const line of lines) {
        if (line.includes("Phần 2. Bảng đáp án nhanh")) break;

        // Nhận diện dòng bắt đầu câu hỏi: "Câu 1. ..." hoặc "Câu 396. ★ ..."
        const qMatch = line.match(/^Câu\s+(\d+)\.\s*(?:★\s*)?(.*)$/i);
        if (qMatch) {
          if (currentQ && currentQ.options.length >= 2) {
            finalizeQuestion(currentQ, answerKeyMap);
          }
          const qNum = parseInt(qMatch[1], 10);
          let rawBody = qMatch[2].trim();
          let tag = "";

          // Tách mã nguồn ở cuối câu (VD: [DOCX·S01-Q001])
          const tagMatch = rawBody.match(/\[([^\]]+)\]\s*$/);
          if (tagMatch) {
            tag = tagMatch[1];
            rawBody = rawBody.slice(0, tagMatch.index).trim();
          }

          currentQ = {
            num: qNum,
            text: rawBody,
            tag: tag,
            options: [],
            answerIndex: -1
          };
          continue;
        }

        // Nhận diện dòng phương án A., B., C., D.
        if (currentQ) {
          const optMatch = line.match(/^([A-D])\.\s*(.*)$/);
          if (optMatch) {
            const label = optMatch[1].toUpperCase();
            let optBody = optMatch[2].trim();
            let isCorrect = false;

            // Kiểm tra dấu ✓ ở cuối phương án
            if (optBody.includes("✓")) {
              isCorrect = true;
              optBody = optBody.replace(/✓/g, "").trim();
            }

            const idx = currentQ.options.length;
            if (isCorrect) currentQ.answerIndex = idx;

            currentQ.options.push({
              label: label,
              text: label + ". " + optBody,
              correctMarked: isCorrect
            });
          } else if (currentQ.options.length === 0) {
            // Nối tiếp văn bản câu hỏi nếu bị xuống dòng
            let extra = line;
            const tagMatch = extra.match(/\[([^\]]+)\]\s*$/);
            if (tagMatch) {
              currentQ.tag = tagMatch[1];
              extra = extra.slice(0, tagMatch.index).trim();
            }
            if (extra) currentQ.text += " " + extra;
          }
        }
      }

      if (currentQ && currentQ.options.length >= 2) {
        finalizeQuestion(currentQ, answerKeyMap);
      }

      isPhilLoaded = true;
      isPhilLoading = false;
      return true;
    } catch (err) {
      console.error(err);
      isPhilLoading = false;
      alert("Không thể đọc file đề Triết học: " + err.message);
      return false;
    }
  }

  function finalizeQuestion(q, answerKeyMap) {
    // Nếu chưa bắt được dấu ✓ thì tra từ Bảng đáp án nhanh ở Phần 2
    if (q.answerIndex === -1 && answerKeyMap[q.num]) {
      const targetLabel = answerKeyMap[q.num];
      const foundIdx = q.options.findIndex(o => o.label === targetLabel);
      if (foundIdx !== -1) {
        q.answerIndex = foundIdx;
        q.options[foundIdx].correctMarked = true;
      }
    }
    if (q.answerIndex === -1) q.answerIndex = 0;

    const group = detectLessonGroup(q.tag, q.text);
    philPool[group].push({
      id: "triet-" + q.num,
      text: q.text,
      options: q.options,
      answerIndex: q.answerIndex,
      sourceKeyMarked: true,
      lessonGroup: group
    });
  }

  // 4. Thuật toán xáo trộn Fisher-Yates & Rút 50 câu chia đều 3 bài (17 - 17 - 16)
  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function drawBalanced50Questions() {
    // Xáo trộn ngẫu nhiên thứ tự phân bổ [17, 17, 16] giữa 3 bài để công bằng tuyệt đối
    const quotas = shuffleArray([17, 17, 16]);
    const g1 = shuffleArray(philPool[1]).slice(0, quotas[0]);
    const g2 = shuffleArray(philPool[2]).slice(0, quotas[1]);
    const g3 = shuffleArray(philPool[3]).slice(0, quotas[2]);

    // Trộn đều toàn bộ 50 câu đã rút để đề thi ngẫu nhiên hoàn toàn
    return shuffleArray([...g1, ...g2, ...g3]);
  }

  // 5. Tích hợp thẳng vào luồng làm bài (Study Screen) hiện tại của Web
  // Bắt sự kiện khi bấm vào thẻ môn "Triết học"
  if (philTile) {
    philTile.addEventListener("click", async function(e) {
      e.preventDefault();
      e.stopImmediatePropagation();

      const badge = philTile.querySelector('.subject-badge');
      const oldBadgeText = badge ? badge.textContent : "";
      if (badge) badge.textContent = "Đang tải đề...";

      const ok = await loadPhilosophyDocx();
      if (badge) badge.textContent = oldBadgeText;
      if (!ok) return;

      // Giữ riêng đề Triết học, không thay đổi kho đề Quốc phòng.
      const selected50 = drawBalanced50Questions();
      PHILOSOPHY_LESSONS = [{ id: 1, title: "Triết học Mác - Lênin (50 câu)", questions: selected50 }];

      // Kích hoạt chế độ lấy toàn bộ 50 câu vừa rút (dùng cơ chế sẵn có của web)
      const scopeSelect = document.getElementById("scope");
      const practiceBtn = document.getElementById("practiceMode");
      const beginBtn = document.getElementById("beginQuiz");

      setActiveSubject("philosophy");
      if (practiceBtn) practiceBtn.click();
      if (scopeSelect) {
        scopeSelect.value = "all";
        scopeSelect.dispatchEvent(new Event("change", { bubbles: true }));
      }
      if (beginBtn) beginBtn.click();
    }, true);
  }
})();
</script>
